<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ticketing Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<link id="pvFont" rel="stylesheet" href="">
<style>
  :root{--bg:#f4f1f6;--card:#fff;--text:#231a29;--muted:#6f6577;--line:#e4dde8;--brand:#6a1b6f;--brand2:#f5cc6a;--ok:#1f8a4c;--warn:#b7791f;--bad:#c53030;--r:12px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.45 'Noto Sans','Noto Sans Devanagari',system-ui,sans-serif;padding-bottom:70px}
  .hide{display:none!important}
  header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  header b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px}
  nav{position:sticky;top:48px;z-index:19;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
  nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
  main{max-width:860px;margin:0 auto;padding:14px}
  h2{margin:4px 0 12px;font-size:19px}
  h3{margin:18px 0 8px;font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.pending{background:#fff3d6;color:#8a5a00}.pill.approved{background:#d9f4e3;color:#16663a}.pill.rejected{background:#fde0e0;color:#9b2222}
  .pill.sent{background:#d9f4e3;color:#16663a}.pill.failed{background:#fde0e0;color:#9b2222}.pill.gray{background:#ece7f0;color:#554b5e}.pill.staff{background:#e6e0ff;color:#3d2a8f}.pill.stu{background:#ffe08a;color:#5a3a00}
  .b.wa{background:#1fa855;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
  .hidden{display:none!important}
  .chk.consent{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#fff6d6;border:1.5px solid #f0c74a;color:#3d2a00;font-size:14px;line-height:1.4}
  .chk.consent.on{background:#e3f6ea;border-color:#7cc99a;color:#14532d}.chk.consent input{margin-top:2px;width:20px;height:20px;flex:none}
  .gpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.gpgrid small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}.gpgrid input{margin:0}
  .qrtile small{display:block;font-size:11px;color:var(--muted)}
  button.b,a.b{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:9px;padding:9px 14px;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
  button.b.sec{background:#ece7f0;color:var(--text)} button.b.ok{background:var(--ok)} button.b.bad{background:var(--bad)}
  button.b.sm{padding:6px 10px;font-size:13px} button.b:disabled{opacity:.5}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:11px 0 4px}
  input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}
  input[type=color]{padding:2px;height:42px;width:100%}
  input[type=checkbox]{width:auto}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  textarea{min-height:110px;resize:vertical}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .payer{display:inline-block;background:#fff176;color:#3b2f00;font-weight:800;padding:3px 9px;border-radius:7px;font-size:15px;border:2px solid #f2c200}
  .thumb{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#eee}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#16663a;background:#d9f4e3;border-radius:999px;padding:3px 10px}
  .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#1f8a4c;box-shadow:0 0 0 0 rgba(31,138,76,.5);animation:livePulse 2s infinite}
  .live.off{color:#6f6577;background:#ece7f0}
  .live.off::before{background:#9b8fa5;animation:none}
  @keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(31,138,76,.5)}70%{box-shadow:0 0 0 7px rgba(31,138,76,0)}100%{box-shadow:0 0 0 0 rgba(31,138,76,0)}}
  .qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-top:8px}
  .qrtile{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:#faf8fb}
  .qrtile b{display:block;font-size:14px;margin-bottom:4px}
  .qrtile img,.qrtile .none{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line);display:block;margin:0 auto}
  .qrtile .none{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
  .qrtile label{display:flex;align-items:center;justify-content:center;min-height:34px;margin:6px 0 0;font-size:12px;font-weight:700;color:var(--brand);cursor:pointer}
  .qrtile input{display:none}
  .dk{margin-top:12px;padding:10px 12px;border-radius:10px;background:#fff8e8;border:1px solid #f0d9a6}
  .dk .row{align-items:flex-start}
  .slot{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);background:#f1ecf4;border-radius:6px;padding:1px 6px;margin-right:6px}
  .names{margin:6px 0;padding-left:18px}
  .names li.person{margin:4px 0}
  .names li.person > *{vertical-align:middle}
  .idthumb{width:54px;height:38px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin-left:8px;cursor:zoom-in;background:#eee}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .toast{position:fixed;left:12px;right:12px;bottom:14px;z-index:99;background:#231a29;color:#fff;padding:12px 14px;border-radius:10px;text-align:center;font-size:14px}
  .toast.err{background:var(--bad)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .modal{background:#fff;border-radius:16px 16px 0 0;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
  @media(min-width:600px){.overlay{align-items:center}.modal{border-radius:16px}}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:70;display:flex;align-items:center;justify-content:center;padding:10px}
  .lightbox img{max-width:100%;max-height:100%}
  .login{max-width:380px;margin:12vh auto;padding:0 16px}
  .err{color:var(--bad);font-size:14px;margin:10px 0}
  .colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .colors label{margin:6px 0 3px;font-size:12px}
  .sw{display:flex;gap:10px;align-items:center}
  .qrimg{width:84px;height:84px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
  .sticky-save{position:sticky;bottom:8px;z-index:5}
  table{border-collapse:collapse;width:100%}
  .chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:500;color:var(--text);font-size:15px}
  /* theme live preview (mini public page) */
  .pvBox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .pv{background:var(--pbg);color:var(--ptext);font-family:var(--pfont);padding:0 0 16px}
  .pv .ban{height:84px;background:linear-gradient(135deg,var(--pprimary),var(--pcard))}
  .pv .in{padding:12px 14px}
  .pv h4{margin:0 0 4px;font-size:21px;color:var(--paccent)}
  .pv .card2{background:var(--pcard);border:1px solid color-mix(in srgb,var(--ptext) 16%,transparent);border-radius:var(--prad);padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pv .btn2{background:var(--pprimary);color:var(--pbtn);border:0;border-radius:var(--prad);padding:10px 14px;font:inherit;font-weight:600;width:100%;margin-top:10px}
  .pv .fld{background:color-mix(in srgb,var(--ptext) 8%,var(--pcard));border:1px solid color-mix(in srgb,var(--ptext) 16%,transparent);border-radius:calc(var(--prad) - 4px);padding:9px;margin-top:8px;font-size:14px;opacity:.9}
  .tkprev{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
  .emprev{background:#faf8fb;border:1px dashed var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:14px}
</style>
</head>
<body>

<section id="login" class="login hide">
  <h2 style="text-align:center">Ticketing Admin</h2>
  <div class="card">
    <label for="lg_email">Email</label><input id="lg_email" type="email" autocomplete="username" inputmode="email">
    <label for="lg_pw">Password</label><input id="lg_pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="lg_err" class="err"></div>
    <button class="b" style="width:100%" onclick="doLogin()">Sign in</button>
  </div>
</section>

<div id="app" class="hide">
  <header><b id="hdrTitle">Admin</b><button onclick="doLogout()">Sign out</button></header>
  <nav id="tabs"></nav>
  <main id="content"></main>
</div>
<div id="lightbox" class="lightbox hide" onclick="this.classList.add('hide')"><img id="lbImg" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ───────────── CONFIG ─────────────
var SUPABASE_URL = 'https://iuvxavsuoiekrjnylxpy.supabase.co';
var SUPABASE_KEY = 'sb_publishable_RAac6qm2v3UEhQx4H4DJ-Q_xxuPy9mv';   // publishable key. The service-role key is NEVER used in the browser.
var PUBLIC_SITE  = 'https://spsevent.vercel.app';   // buyer site (used for the staff booking link)
var SCANNER_URL  = '';    // optional: shown on the Staff tab, e.g. https://your-scanner.vercel.app
// ──────────────────────────────────

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var A = { settings: null, types: [], counts: {}, orders: null, tickets: null, emails: null, templates: null,
          tab: 'orders', ordFilter: 'pending', ordQ: '', ordLimit: 40, shots: {}, editType: null, atFilter: 'approved', atQ: '', atLimit: 100 };
var T = {};      // tab renderers
var ACT = {};    // click actions  (data-act="...")
var SETTINGS_BASE = 'id,name,date_text,venue,description,contact_phone,contact_email,payment_instructions,terms_text,sales_open,sales_start,sales_end,closed_message,max_per_order,logo_path,banner_path,theme,ticket_design';
var SETTINGS_COLS = SETTINGS_BASE + ',payment_qr_path,instructions_text,upi_id,dandiya_enabled,dandiya_rent,dandiya_deposit,dandiya_max,dandiya_qrs';

}
var TABS = [['orders', 'Orders'], ['manual', 'Offline order'], ['types', 'Ticket types'], ['attendees', 'Attendees'], ['emails', 'Emails'],
            ['event', 'Event'], ['theme', 'Theme'], ['ticket', 'Ticket design'], ['templates', 'Email text'], ['staff', 'Staff']];
var FONTS = { 'Poppins': 'Poppins:wght@400;600;700', 'Inter': 'Inter:wght@400;600;700', 'Playfair Display': 'Playfair+Display:wght@400;600;700',
              'Hind': 'Hind:wght@400;600;700', 'Noto Sans Devanagari': 'Noto+Sans+Devanagari:wght@400;600;700' };
var FONT_LABEL = { 'Hind': 'Hind (supports Hindi)', 'Noto Sans Devanagari': 'Noto Sans Devanagari (Hindi)' };
var DARK = { mode: 'dark', primary: '#f5b83d', background: '#1f0823', card: '#321037', text: '#fdf3e3', accent: '#f5cc6a', button_text: '#2b0a30', radius: 14, font: 'Poppins' };
var LIGHT = { mode: 'light', primary: '#8e1b5a', background: '#fbf7f2', card: '#ffffff', text: '#2a1a2e', accent: '#8e1b5a', button_text: '#ffffff', radius: 14, font: 'Poppins' };
var DEFAULT_TICKET = { strip_bg: '#2b0a30', strip_text: '#fff4e0', accent: '#f5cc6a', number_color: '#f9d77a', qr_color: '#2b0a30',
  header_text: 'ADMIT {count}', footer_note: 'Bring your school ID', show_type: true, show_date: true, show_venue: true, show_number: true, show_logo: false };
var DEFAULT_TEMPLATES = {
  received: { subject: 'We received your order {order_no} - {event}', body: 'Hi {name},\n\nThank you! We received your order {order_no} for {event} ({qty} x {type}, Rs {amount}).\n\nWe are verifying your payment. Once it is approved, your ticket will be emailed to you.\n\nTrack your order here: {link}\n\n{event}\n{date}\n{venue}' },
  approved: { subject: 'Your ticket for {event} ({order_no})', body: 'Hi {name},\n\nYour payment is verified. Your ticket(s) for {event} are attached to this email as a PDF.\n\nDate: {date}\nVenue: {venue}\n\nPlease keep the QR code ready at the gate. Each ticket can be used only once.\n\nBackup link to your tickets: {link}' },
  rejected: { subject: 'Update on your order {order_no} - {event}', body: 'Hi {name},\n\nWe could not verify the payment for order {order_no}.\nReason: {reason}\n\nIf you think this is a mistake, please contact us: {contact_phone} {contact_email}\n\nOrder link: {link}' }
};

// <ticket-svg>
// MASTER COPY of the on-screen ticket renderer. It is inlined into public/index.html and admin/index.html
// between the "<ticket-svg>" markers by tools/sync-ticket-svg.py (edit here, then run that script).
// Keep the geometry identical to drawTicket() in admin/api/_pdf.js so screen and PDF look the same.
var TK_W = 1000, TK_ART_H = 780 / 2016 * 1000, TK_STRIP_H = 170, TK_H = TK_ART_H + TK_STRIP_H;
function tkEsc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function tkHex(c, d) { return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : d; }
function tkFit(text, size, maxW, bold, min) {
  var k = bold ? 0.66 : 0.6, s = size;
  while (s > (min || 14) && text.length * s * k > maxW) s -= 1;
  if (text.length * s * k > maxW) text = text.slice(0, Math.max(1, Math.floor(maxW / (s * k)) - 1)) + '…';
  return { text: text, size: s };
}
// t: {code, attendee_name (all names, comma separated), count}; c: {s: event settings, typeName, accent, logoUrl, bgUrl}
function renderTicketSVG(t, c) {
  var s = c.s || {}, d = s.ticket_design || {};
  var stripBg = tkHex(d.strip_bg, '#2b0a30'), stripText = tkHex(d.strip_text, '#fff4e0');

  for (r = 0; r < n; r++) for (q = 0; q < n; q++) {

  }
  var y0 = TK_ART_H, tx = 36, o = '';
  o += '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + TK_W + ' ' + TK_H.toFixed(2) + '" width="100%" style="display:block" role="img" aria-label="Ticket ' + tkEsc(t.code) + '">';
  o += '<image href="' + tkEsc(c.bgUrl) + '" x="0" y="0" width="' + TK_W + '" height="' + TK_ART_H.toFixed(2) + '" preserveAspectRatio="none"/>';
  if (d.show_number !== false) {
    o += '<text x="106.6" y="95" text-anchor="middle" font-size="19" letter-spacing="2.5" fill="' + numColor + '" ' + FF + '>' + tkEsc(t.code.replace(/^TKT-/, '')) + '</text>';

  o += '<rect x="0" y="' + y0.toFixed(2) + '" width="' + TK_W + '" height="' + TK_STRIP_H + '" fill="' + stripBg + '"/>';
  o += '<rect x="0" y="' + y0.toFixed(2) + '" width="' + TK_W + '" height="5" fill="' + accent + '"/>';

  }

  }

// </ticket-svg>

// ───────────── helpers ─────────────
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function val(id) { var e = $(id); return e ? e.value : ''; }
function pubUrl(p) { return p ? SUPABASE_URL + '/storage/v1/object/public/branding/' + p : ''; }
function rupees(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }
function fmt(ts) { return ts ? new Date(ts).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : ''; }
function errText(e) {
  var m = (e && (e.message || e.error_description || e.error)) || String(e);
  if (/CONSENT_MISSING/.test(m)) return 'This pass has a student: tick \u201CConsent form received\u201D first.';
  return m;

async function api(path, body, method) {
  var ses = (await sb.auth.getSession()).data.session;
  var opt = { method: method || 'POST', headers: { 'Authorization': 'Bearer ' + (ses ? ses.access_token : ''), 'Content-Type': 'application/json' } };
  if (opt.method !== 'GET') opt.body = JSON.stringify(body || {});
  var r = await fetch(path, opt), j;
  try { j = await r.json(); } catch (e) { j = { ok: false, error: 'Server error (' + r.status + ')' }; }
  if (!r.ok && j.ok == null) j.ok = false;
  if (!r.ok && !j.error) j.error = 'Error ' + r.status;

}

// Resize + re-encode an image file in the browser. kind: 'png' (keeps transparency) or 'jpeg'.
function resizeImage(file, maxDim, kind) {
  return new Promise(function (resolve, reject) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var sc = Math.min(1, maxDim / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      var x = c.getContext('2d');
      if (kind === 'jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? resolve(b) : reject(new Error('Could not process image')); }, kind === 'jpeg' ? 'image/jpeg' : 'image/png', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That file is not a readable image')); };
    img.src = url;
  });
}
async function uploadBranding(prefix, file, maxDim, kind) {
  var blob = await resizeImage(file, maxDim, kind);
  var path = prefix + '-' + Date.now() + (kind === 'jpeg' ? '.jpg' : '.png');
  var r = await sb.storage.from('branding').upload(path, blob, { contentType: blob.type, upsert: false });
  if (r.error) throw r.error;
  return path;
}

// ───────────── live updates: Supabase Realtime + a quiet 20s safety re-check ─────────────
var RT = { ch: null, timer: null, poll: null, sig: '', ok: false };
function ordersSig() {
  return JSON.stringify((A.orders || []).map(function (o) { var d = (A.rentals || {})[o.id] || {}; return [o.id, o.status, o.email, o.checked_in, d.id, d.status, d.deposit_refunded]; }));
}
function setTitleCount() {

}
function setLive(ok) {
  RT.ok = ok; var d = $('liveDot'); if (!d) return;
  d.classList.toggle('off', !ok); d.textContent = ok ? 'Live' : 'Auto-refresh';
  d.title = ok ? 'New orders appear instantly' : 'Checks for new orders every 20 seconds (run sql/10_realtime.sql for instant updates)';
}
async function liveRefresh() {
  if (!A.orders) { try { await loadOrders(true); RT.sig = ordersSig(); setTitleCount(); } catch (e) {} return; }
  var oldIds = {}, oldDk = {};
  A.orders.forEach(function (o) { oldIds[o.id] = 1; var d = (A.rentals || {})[o.id]; if (d) oldDk[d.id] = 1; });
  try { await loadOrders(true); } catch (e) { return; }
  var sig = ordersSig(); if (sig === RT.sig) return; RT.sig = sig;
  var fresh = A.orders.filter(function (o) { return !oldIds[o.id]; });
  var freshDk = Object.keys(A.rentals || {}).map(function (k) { return A.rentals[k]; }).filter(function (d) { return !oldDk[d.id] && d.status === 'pending'; });
  if (fresh.length) toast(fresh.length === 1 ? 'New order: ' + fresh[0].order_no + ' \u00B7 ' + fresh[0].type_name : fresh.length + ' new orders');
  else if (freshDk.length) toast('New dandiya request (' + freshDk[0].pairs + ' pair' + (freshDk[0].pairs === 1 ? '' : 's') + ')');
  if (A.tab === 'orders' && $('ordList')) drawOrderList(); else setTitleCount();
}
function queueRefresh() { clearTimeout(RT.timer); RT.timer = setTimeout(liveRefresh, 700); }
function startLive() {
  if (RT.poll) return;
  RT.sig = ordersSig();
  if (sb.channel) {
    try {
      RT.ch = sb.channel('admin-orders')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, queueRefresh)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'dandiya_rentals' }, queueRefresh)
        .subscribe(function (status) { setLive(status === 'SUBSCRIBED'); });
    } catch (e) { setLive(false); }
  }
  RT.poll = setInterval(function () { if (!document.hidden) liveRefresh(); }, 20000);   // safety net if Realtime is off
  document.addEventListener('visibilitychange', function () { if (!document.hidden) liveRefresh(); });
}

ACT.approve = async function (d, b) {
  var o = orderById(d.id);
  if (!confirm('Approve ' + o.order_no + ' and email the ticket to ' + o.email + '?')) return;
  busy(b);
  try {
    var r = await sb.rpc('admin_set_order_status', { p_order_id: +d.id, p_status: 'approved' });
    if (r.error) throw r.error;
    var m = await api('/api/send-ticket', { order_id: +d.id, kind: 'approved' });
    toast(m.ok ? 'Approved. Ticket emailed.' : 'Approved, but the email failed: ' + m.error + ' — use Resend.', !m.ok);
  } catch (e) { toast(errText(e), true); }
  refreshOrders();
};
ACT.rejectAsk = function (d) {
  modal('<h3 style="margin-top:0">Reject ' + esc(orderById(d.id).order_no) + '</h3><label>Reason (optional, shown to the buyer)</label><textarea id="rjReason" placeholder="e.g. Payment not found in our account"></textarea>' +
    '<div class="acts"><button class="b bad" data-act="rejectDo" data-id="' + d.id + '">Reject &amp; email buyer</button><button class="b sec" onclick="closeModal()">Cancel</button></div>');
};
ACT.rejectDo = async function (d, b) {
  var reason = val('rjReason'); busy(b);
  try {
    var r = await sb.rpc('admin_set_order_status', { p_order_id: +d.id, p_status: 'rejected', p_reason: reason });
    if (r.error) throw r.error;
    closeModal();
    var m = await api('/api/send-ticket', { order_id: +d.id, kind: 'rejected' });
    toast(m.ok ? 'Rejected. Buyer emailed.' : 'Rejected, but the email failed: ' + m.error, !m.ok);
  } catch (e) { toast(errText(e), true); busy(b, false); }
  refreshOrders();
};
ACT.resend = async function (d, b) {
  busy(b); var m = await api('/api/send-ticket', { order_id: +d.id, kind: 'resent' });
  toast(m.ok ? 'Email sent.' : 'Email failed: ' + m.error, !m.ok); busy(b, false);
  if (A.emails) A.emails = null;
};
ACT.toPending = async function (d, b) {
  busy(b);
  try { var r = await sb.rpc('admin_set_order_status', { p_order_id: +d.id, p_status: 'pending' }); if (r.error) throw r.error; toast('Moved back to pending.'); }
  catch (e) { toast(/NO_SEATS_LEFT/.test(errText(e)) ? 'No seats left for this ticket type. Increase its seats first.' : errText(e), true); }
  refreshOrders();
};
ACT.editEmail = function (d) {
  var o = orderById(d.id);
  modal('<h3 style="margin-top:0">Edit email for ' + esc(o.order_no) + '</h3><label>Email address</label><input id="emNew" type="email" inputmode="email" value="' + esc(o.email) + '">' +
    '<div class="acts"><button class="b" data-act="emSave" data-id="' + d.id + '" data-resend="1">Save &amp; resend</button><button class="b sec" data-act="emSave" data-id="' + d.id + '">Save only</button><button class="b sec" onclick="closeModal()">Cancel</button></div>');
};
ACT.emSave = async function (d, b) {
  var em = val('emNew').trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast('Enter a valid email address.', true);
  busy(b);
  var r = await sb.from('orders').update({ email: em }).eq('id', +d.id);
  if (r.error) { toast(errText(r.error), true); busy(b, false); return; }
  closeModal();
  if (d.resend) { var m = await api('/api/send-ticket', { order_id: +d.id, kind: 'resent' }); toast(m.ok ? 'Saved. Email sent.' : 'Saved, but the email failed: ' + m.error, !m.ok); }
  else toast('Email saved.');
  refreshOrders();
};

// ───────────── ADD MANUAL ORDER ─────────────
var M = { qty: 1, names: [''], firstEdited: false, free: false };
T.manual = async function () {
  await Promise.all([loadTypes(), A.settings ? null : loadSettings()]);
  var types = A.types;
  if (!types.length) { $('content').innerHTML = '<h2>Add order</h2><div class="card">Add a ticket type first.</div>'; return; }
  $('content').innerHTML = '<h2>Offline order</h2><div class="card muted">For cash sales at school or complimentary tickets. No payment screenshot; issued as approved. With an email the ticket is emailed; without one, open or print the ticket here after issuing.</div>' +
    '<div class="card"><label>Ticket type</label><select id="mn_type" onchange="mnQty()">' + types.map(function (t) {
      var left = t.capacity - ((A.counts[t.id] || {}).taken || 0);
      return '<option value="' + t.id + '">' + esc(t.name) + ' — ' + rupees(t.price) + ' (' + left + ' left)' + (t.active ? '' : ' [off sale]') + '</option>'; }).join('') + '</select>' +
    '<div class="grid2"><div><label>Number of passes</label><input id="mn_qty" type="number" min="1" max="50" value="1" oninput="mnQty()"></div>' +
    '<div><label>Amount received (₹)</label><input id="mn_amt" type="number" min="0"></div></div>' +
    '<label class="chk"><input type="checkbox" id="mn_free" onchange="mnTotal()"> Complimentary (₹0)</label>' +
    '<label>Buyer name</label><input id="mn_name" oninput="mnBuyer()">' +
    '<div class="grid2"><div><label>Email (optional; ticket is sent here)</label><input id="mn_email" type="email" inputmode="email"></div>' +
    '<div><label>WhatsApp number (optional)</label><input id="mn_phone" type="tel"></div></div>' +
    '<div id="mn_names"></div><label class="chk consent hidden" id="mn_consent_l"><input type="checkbox" id="mn_consent"> <span><b>Consent form received</b> for every student on this pass (required before issuing)</span></label>' + mnDkHTML() + '<div id="mn_err" class="err"></div>' +
    '<button class="b" id="mn_go" data-act="mnSave">Issue ticket</button></div>';
  M = { qty: 1, names: [''], roles: [], firstEdited: false };
  mnNames(); mnTotal();
};
function mnTotal() {
  var t = A.types.filter(function (x) { return String(x.id) === val('mn_type'); })[0]; if (!t) return;
  var free = $('mn_free').checked; $('mn_amt').value = free ? 0 : typeTotal(t, +val('mn_qty') || 1); $('mn_amt').disabled = free;
}
function mnType() { return A.types.filter(function (x) { return String(x.id) === val('mn_type'); })[0] || {}; }
function mnNames() {
  var t = mnType(), p = t.persons_per_unit || 1, lb = t.person_labels || [], h = '<label>Name of each person</label>';
  for (var i = 0; i < M.qty * p; i++) {
    var tag = p > 1 ? (t.unit_label || 'Group') + ' ' + (Math.floor(i / p) + 1) + ' \u00B7 ' + (lb[i % p] || 'Person ' + (i % p + 1)) : 'Person ' + (i + 1);
    if (p === 1 && hasGroupPrices()) {
      h += '<div class="row" style="gap:6px;margin-bottom:6px"><input id="mn_n' + i + '" style="flex:1;min-width:0;margin:0" placeholder="' + esc(tag) + '" value="' + esc(M.names[i] || '') + '" oninput="mnAtt(' + i + ')">' +
        '<select id="mn_r' + i + '" style="width:auto;margin:0" onchange="M.roles[' + i + ']=this.value;mnConsentShow()"><option value="guest">Parent / Guest</option><option value="student"' + (M.roles[i] === 'student' ? ' selected' : '') + '>Student</option></select></div>';
    } else h += '<input id="mn_n' + i + '" style="margin-bottom:6px" placeholder="' + esc(tag) + '" value="' + esc(M.names[i] || '') + '" oninput="mnAtt(' + i + ')">';
  }
  $('mn_names').innerHTML = h;
  mnConsentShow();
}
// Dandiya sticks sold with an offline pass (recorded as an approved rental; shows at the gate)
function mnDkHTML() {
  var st = A.settings || {}; if (st.dandiya_rent === undefined) return '';
  var per = (st.dandiya_rent || 0) + (st.dandiya_deposit || 0), opts = '';
  for (var n = 1; n <= (st.dandiya_max || 10); n++) opts += '<option value="' + n + '">' + n + '</option>';
  return '<label class="chk"><input type="checkbox" id="mn_dk" onchange="mnDk()"> <b>Dandiya sticks included</b></label>' +
    '<div id="mn_dk_box" class="hidden"><div class="grid2"><div><label>Pairs</label><select id="mn_dk_pairs" onchange="mnDk()">' + opts + '</select></div>' +
    '<div><label>Dandiya amount received (\u20B9)</label><input id="mn_dk_amt" type="number" min="0"></div></div>' +
    '<div class="muted">' + rupees(st.dandiya_rent || 0) + ' rent + ' + rupees(st.dandiya_deposit || 0) + ' refundable security per pair = ' + rupees(per) + ' per pair. Set 0 if the sticks are free.</div></div>';
}
function mnDk() {
  var on = $('mn_dk') && $('mn_dk').checked, st = A.settings || {}; if (!$('mn_dk_box')) return;
  $('mn_dk_box').classList.toggle('hidden', !on);
  if (on) $('mn_dk_amt').value = (+val('mn_dk_pairs') || 1) * ((st.dandiya_rent || 0) + (st.dandiya_deposit || 0));
}
function mnConsentShow() { var l = $('mn_consent_l'); if (l) l.classList.toggle('hidden', M.roles.indexOf('student') < 0); }
function mnQty() {
  var q = Math.max(1, Math.min(50, +val('mn_qty') || 1)), n = q * (mnType().persons_per_unit || 1); M.qty = q;
  while (M.names.length < n) M.names.push(''); M.names.length = n; M.roles.length = n; mnNames(); mnTotal();
}
function mnBuyer() { if (!M.firstEdited) { M.names[0] = val('mn_name'); var e = $('mn_n0'); if (e) e.value = M.names[0]; } }
function mnAtt(i) { M.names[i] = val('mn_n' + i); if (i === 0 && M.names[0] !== val('mn_name')) M.firstEdited = true; }
ACT.mnAgain = function () { showTab('manual'); };
ACT.mnSave = async function (d, b) {
  var err = $('mn_err'); err.textContent = '';
  var name = val('mn_name').trim(), email = val('mn_email').trim(), names = [];
  for (var i = 0; i < M.qty * (mnType().persons_per_unit || 1); i++) names.push(val('mn_n' + i).trim());
  if (name.length < 2) { err.textContent = 'Enter the buyer name.'; return; }
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Check the email address, or leave it empty.'; return; }
  for (i = 0; i < names.length; i++) if (names[i].length < 2) { err.textContent = 'Enter the name for ' + ($('mn_n' + i).placeholder || 'person ' + (i + 1)) + '.'; return; }
  busy(b);
  try {
    var args = { p_type_id: +val('mn_type'), p_qty: M.qty, p_buyer_name: name, p_email: email,
      p_phone: val('mn_phone').trim(), p_names: names, p_amount: $('mn_free').checked ? 0 : (+val('mn_amt') || 0) };
    if ($('mn_r0')) args.p_roles = names.map(function (x, k) { return val('mn_r' + k) === 'student' ? 'student' : 'guest'; });
    if (args.p_roles && args.p_roles.indexOf('student') >= 0) {
      if (!$('mn_consent').checked) { busy(b, false); err.textContent = 'This pass has a student: tick \u201CConsent form received\u201D before issuing.'; return; }
      args.p_consent = true;
    }
    var r = await sb.rpc('admin_create_manual_order', args);
    if (r.error) throw r.error;
    A.orders = null;
    var link = PUBLIC_SITE + '/#/order/' + r.data.token, pdf = '/api/ticket-pdf?token=' + encodeURIComponent(r.data.token), sent = '', dk = '';
    if ($('mn_dk') && $('mn_dk').checked) {
      var pairs = +val('mn_dk_pairs') || 1, dr = await sb.rpc('admin_add_dandiya', { p_order_id: r.data.order_id, p_pairs: pairs, p_amount: Math.max(0, Math.round(+val('mn_dk_amt') || 0)) });
      dk = dr.error ? 'Dandiya not recorded: ' + esc(errText(dr.error)) + ' (add it from Orders).' : 'Dandiya: <b>' + pairs + ' pair' + (pairs === 1 ? '' : 's') + '</b> for ' + rupees(dr.data.amount) + ' (shows at the gate).';
    }
    if (email) {
      var m = await api('/api/send-ticket', { order_id: r.data.order_id, kind: 'approved' });
      sent = m.ok ? 'Emailed to ' + esc(email) + '.' : 'The email failed: ' + esc(m.error) + ' (Resend from Orders).';
    }
    $('content').innerHTML = '<h2>Offline order</h2><div class="card"><b>' + esc(r.data.order_no) + ' issued</b> <span class="pill approved">approved</span>' +
      (dk ? '<div style="margin-top:6px">' + dk + '</div>' : '') + (sent ? '<div class="muted" style="margin-top:6px">' + sent + '</div>' : '') +
      '<div class="muted" style="margin-top:6px">Show the QR on the ticket page, or download the PDF to print or send on WhatsApp.</div>' +
      '<div class="acts">' + waLink({ phone: args.p_phone, token: r.data.token, buyer_name: name, order_no: r.data.order_no }) + '<a class="b" href="' + esc(link) + '" target="_blank" rel="noopener">Open ticket</a><a class="b sec" href="' + esc(pdf) + '" target="_blank" rel="noopener">Download PDF</a>' +
      '<button class="b sec" data-act="mnAgain">New offline order</button></div></div>';
  } catch (e) {
    var t = errText(e); busy(b, false);
    err.textContent = /NOT_ENOUGH_SEATS:(\d+)/.test(t) ? 'Only ' + RegExp.$1 + ' seat(s) left for this type.' : t;
  }
};

// ───────────── TICKET TYPES ─────────────
T.types = async function () { await Promise.all([loadTypes(), loadOrders()]); drawTypes(); };
function typeOrderCount(id) { return (A.orders || []).filter(function (o) { return o.type_id === id; }).length; }
function drawTypes() {
  var h = '<div class="row"><h2>Ticket types</h2><button class="b" data-act="typeNew">+ Add type</button></div>';
  if (A.editType === 'new') h += typeForm({ id: 'new', name: '', description: '', price: 0, capacity: 100, accent_color: null, active: false, persons_per_unit: 1, person_labels: [], unit_label: '' });
  A.types.forEach(function (t, i) {
    if (A.editType === t.id) { h += typeForm(t); return; }
    var c = A.counts[t.id] || { taken: 0, approved: 0 }, n = typeOrderCount(t.id);
    h += '<div class="card"' + (t.accent_color ? ' style="border-left:5px solid ' + esc(t.accent_color) + '"' : '') + '><div class="row"><div><b>' + esc(t.name) + '</b> ' +
      (t.active ? '<span class="pill approved">On sale</span>' : '<span class="pill gray">Off sale</span>') + '<div class="muted">' + esc(t.description) + '</div></div>' +
      '<div style="text-align:right"><b>' + rupees(t.price) + '</b><div class="muted">' + c.taken + ' of ' + t.capacity + ' taken</div></div></div>' +
      '<div class="muted" style="margin-top:4px">' + c.approved + ' approved · ' + (c.taken - c.approved) + ' pending · ' + Math.max(t.capacity - c.taken, 0) + ' passes left' +
        ((t.persons_per_unit || 1) > 1 ? ' \u00B7 ' + t.persons_per_unit + ' people per pass (' + esc((t.person_labels || []).join(' + ')) + ')' : ((t.person_labels || [])[0] ? ' \u00B7 ' + esc(t.person_labels[0]) : '')) + '</div>' +
      (groupSummary(t) ? '<div class="muted" style="margin-top:4px">Group prices: <b>' + groupSummary(t) + '</b></div>' : '') +
      '<div style="margin-top:10px"><b style="font-size:14px">Payment QR for each amount</b><div class="muted">Upload a UPI QR made for exactly this amount. Buyers see the one that matches their total.</div>' +
        qrGrid('type', t.id, (A.settings && A.settings.max_per_order) || 5, function (n) { return typeTotal(t, n); }, t.payment_qrs) + '</div>' +
      '<div class="acts"><button class="b sec sm" data-act="typeUp" data-id="' + t.id + '"' + (i === 0 ? ' disabled' : '') + '>▲</button><button class="b sec sm" data-act="typeDown" data-id="' + t.id + '"' + (i === A.types.length - 1 ? ' disabled' : '') + '>▼</button>' +
      '<button class="b sec" data-act="typeEdit" data-id="' + t.id + '">Edit</button>' +
      '<button class="b sec" data-act="typeToggle" data-id="' + t.id + '">' + (t.active ? 'Turn off sale' : 'Turn on sale') + '</button>' +
      (n ? '<button class="b sec" disabled title="Has orders; turn it off instead">Delete (has ' + n + ' orders)</button>' : '<button class="b bad" data-act="typeDelete" data-id="' + t.id + '">Delete</button>') + '</div></div>';
  });
  if (!A.types.length && A.editType !== 'new') h += '<div class="card muted" style="text-align:center">No ticket types yet.</div>';
  $('content').innerHTML = h;
}
// Total for q passes: the group price for q if set, else price x q (same rule as the database).
function typeTotal(t, q) { var g = +((t.group_prices || {})[String(q)]); return g > 0 ? g : t.price * q; }
function hasGroupPrices() { return A.types.some(function (t) { return t.group_prices !== undefined; }); }   // sql/14 run
function groupSummary(t) {
  var gp = t.group_prices || {};
  return Object.keys(gp).map(Number).filter(function (q) { return q > 1 && +gp[q] > 0; }).sort(function (a, b) { return a - b; })
    .map(function (q) { return q + ' for ' + rupees(+gp[q]); }).join(' \u00B7 ');
}
function typeForm(t) {
  var hasAcc = !!t.accent_color;
  return '<div class="card" style="border:2px solid var(--brand)"><b>' + (t.id === 'new' ? 'New ticket type' : 'Edit ticket type') + '</b>' +
    '<label>Name</label><input id="tf_name" value="' + esc(t.name) + '"><label>Description</label><input id="tf_desc" value="' + esc(t.description) + '">' +
    '<div class="grid2"><div><label>Price per pass (₹)</label><input id="tf_price" type="number" min="0" value="' + esc(t.price) + '"></div><div><label>Total passes (seats)</label><input id="tf_cap" type="number" min="0" value="' + esc(t.capacity) + '"></div></div>' +
    '<div class="grid2"><div><label>People per pass</label><select id="tf_ppu">' + [1, 2, 3, 4].map(function (n) { return '<option' + ((t.persons_per_unit || 1) === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div>' +
    '<div><label>Pass is called (when more than 1 person)</label><input id="tf_unit" placeholder="e.g. Couple" value="' + esc(t.unit_label || '') + '"></div></div>' +
    '<label>Who is on each pass (comma separated)</label><input id="tf_labels" placeholder="e.g. Male, Female   or   Female" value="' + esc((t.person_labels || []).join(', ')) + '">' +
    (hasGroupPrices() ? '<label>Group prices: total for buying several passes together (leave empty for the normal price)</label><div class="gpgrid">' +
      (function () { var h = '', mx = (A.settings && A.settings.max_per_order) || 5; for (var q = 2; q <= Math.min(mx, 10); q++) {
        var v = (t.group_prices || {})[String(q)];
        h += '<div><small>' + q + ' passes</small><input id="tf_g' + q + '" type="number" min="0" placeholder="' + esc((t.price || 0) * q) + '" value="' + esc(v == null ? '' : v) + '"></div>'; } return h; })() + '</div>' : '') +
    '<label class="chk"><input type="checkbox" id="tf_hasacc"' + (hasAcc ? ' checked' : '') + '> Use an accent colour on this ticket</label><input type="color" id="tf_acc" value="' + esc(t.accent_color || '#f5cc6a') + '">' +
    '<label class="chk"><input type="checkbox" id="tf_active"' + (t.active ? ' checked' : '') + '> On sale</label><div id="tf_err" class="err"></div>' +
    '<div class="acts"><button class="b" data-act="typeSave" data-id="' + t.id + '">Save</button><button class="b sec" data-act="typeCancel">Cancel</button></div></div>';
}
ACT.typeNew = function () { A.editType = 'new'; drawTypes(); };
ACT.typeEdit = function (d) { A.editType = +d.id; drawTypes(); };
ACT.typeCancel = function () { A.editType = null; drawTypes(); };
ACT.typeSave = async function (d, b) {
  var row = { name: val('tf_name').trim(), description: val('tf_desc').trim(), price: Math.round(+val('tf_price')), capacity: Math.round(+val('tf_cap')),
              accent_color: $('tf_hasacc').checked ? val('tf_acc') : null, active: $('tf_active').checked,
              persons_per_unit: +val('tf_ppu') || 1, unit_label: val('tf_unit').trim(),
              person_labels: val('tf_labels').split(',').map(function (x) { return x.trim(); }).filter(Boolean) };
  if ($('tf_g2')) {
    row.group_prices = {};
    for (var q = 2; $('tf_g' + q); q++) { var g = Math.round(+val('tf_g' + q)); if (g > 0) row.group_prices[String(q)] = g; }
  }
  var e = $('tf_err');
  if (!row.name) { e.textContent = 'Enter a name.'; return; }
  if (!(row.price >= 0) || !(row.capacity >= 0)) { e.textContent = 'Price and seats must be 0 or more.'; return; }
  busy(b);
  var r;
  if (d.id === 'new') { row.sort_order = A.types.length ? Math.max.apply(null, A.types.map(function (t) { return t.sort_order; })) + 10 : 10; r = await sb.from('ticket_types').insert(row); }
  else r = await sb.from('ticket_types').update(row).eq('id', +d.id);
  if (r.error) { e.textContent = errText(r.error); busy(b, false); return; }
  A.editType = null; toast('Saved.'); T.types();
};
ACT.typeToggle = async function (d) {
  var t = A.types.filter(function (x) { return x.id === +d.id; })[0];
  var r = await sb.from('ticket_types').update({ active: !t.active }).eq('id', t.id);
  if (r.error) return toast(errText(r.error), true); T.types();
};
ACT.typeDelete = async function (d) {
  var t = A.types.filter(function (x) { return x.id === +d.id; })[0];
  if (!confirm('Delete "' + t.name + '"? This cannot be undone.')) return;
  var r = await sb.from('ticket_types').delete().eq('id', t.id);
  if (r.error) return toast(/foreign key|violates/i.test(errText(r.error)) ? 'This type has orders. Turn it off instead.' : errText(r.error), true);
  removeBranding(t.payment_qr_path); toast('Deleted.'); T.types();
};
async function typeMove(id, dir) {
  var i = A.types.map(function (t) { return t.id; }).indexOf(id), j = i + dir;
  if (j < 0 || j >= A.types.length) return;
  var arr = A.types.slice(); var x = arr[i]; arr[i] = arr[j]; arr[j] = x;
  for (var k = 0; k < arr.length; k++) {
    var r = await sb.from('ticket_types').update({ sort_order: (k + 1) * 10 }).eq('id', arr[k].id);
    if (r.error) return toast(errText(r.error), true);
  }
  T.types();
}
ACT.typeUp = function (d) { typeMove(+d.id, -1); };
ACT.typeDown = function (d) { typeMove(+d.id, 1); };

// ───────────── payment QR grids: one UPI QR per exact amount ─────────────
function qrGrid(kind, id, max, unit, map) {
  var h = '<div class="qrgrid">';
  for (var n = 1; n <= max; n++) {
    var path = (map || {})[String(n)], amt = typeof unit === 'function' ? unit(n) : unit * n;
    h += '<div class="qrtile"><b>' + rupees(amt) + '</b>' + (typeof unit === 'function' ? '<small>' + n + ' pass' + (n === 1 ? '' : 'es') + '</small>' : '') +
      (path ? '<img src="' + esc(pubUrl(path)) + '" alt="QR for ' + rupees(amt) + '">' : '<div class="none">No QR</div>') +
      '<label>' + (path ? 'Replace' : 'Upload') + '<input type="file" accept="image/*" onchange="qrUp(\'' + kind + '\',' + id + ',' + n + ',this)"></label></div>';
  }
  return h + '</div>';
}

  if (r.error) return toast(errText(r.error), true);

  toast('Saved. The public page is updated.'); await loadSettings(); if ($('ev_dk')) T.event();
};

// ───────────── THEME ─────────────
var TH = null;
T.theme = async function () {
  await loadSettings();
  TH = Object.assign({}, DARK, A.settings.theme || {});
  var cf = [['primary', 'Primary'], ['background', 'Background'], ['card', 'Card'], ['text', 'Text'], ['accent', 'Accent'], ['button_text', 'Button text']];
  $('content').innerHTML = '<h2>Theme</h2><div class="card"><label style="margin-top:0">Light or dark (fills in a matching palette; tweak after)</label>' +
    '<div class="chips"><button class="chip" id="thm_dark" data-act="thMode" data-m="dark">Dark</button><button class="chip" id="thm_light" data-act="thMode" data-m="light">Light</button></div>' +
    '<div class="colors">' + cf.map(function (c) { return '<div><label>' + c[1] + '</label><input type="color" id="th_' + c[0] + '" value="' + esc(TH[c[0]]) + '" oninput="thRead()"></div>'; }).join('') + '</div>' +
    '<label>Corner roundness: <span id="th_rv">' + TH.radius + '</span>px</label><input type="range" id="th_radius" min="0" max="28" value="' + TH.radius + '" oninput="thRead()">' +
    '<label>Font</label><select id="th_font" onchange="thRead()">' + Object.keys(FONTS).map(function (f) { return '<option value="' + f + '"' + (TH.font === f ? ' selected' : '') + '>' + esc(FONT_LABEL[f] || f) + '</option>'; }).join('') + '</select>' +
    '<div class="acts"><button class="b" data-act="thSave">Save theme</button><button class="b sec" data-act="thReset">Reset to default</button></div></div>' +
    '<h3>Live preview</h3><div class="pvBox"><div id="pv"></div></div>';
  thDraw();
};
function thRead() {
  ['primary', 'background', 'card', 'text', 'accent', 'button_text'].forEach(function (k) { TH[k] = val('th_' + k); });
  TH.radius = +val('th_radius'); TH.font = val('th_font'); $('th_rv').textContent = TH.radius; thDraw();
}
function thDraw() {
  $('thm_dark').classList.toggle('on', TH.mode !== 'light'); $('thm_light').classList.toggle('on', TH.mode === 'light');
  $('pvFont').href = 'https://fonts.googleapis.com/css2?family=' + (FONTS[TH.font] || FONTS.Poppins) + '&display=swap';
  var s = A.settings;
  $('pv').className = 'pv';
  $('pv').setAttribute('style', '--pbg:' + TH.background + ';--pcard:' + TH.card + ';--ptext:' + TH.text + ';--pprimary:' + TH.primary + ';--paccent:' + TH.accent +
    ';--pbtn:' + TH.button_text + ';--prad:' + TH.radius + 'px;--pfont:\'' + TH.font + '\',\'Noto Sans Devanagari\',sans-serif');
  $('pv').innerHTML = '<div class="ban"></div><div class="in"><h4>' + esc(s.name) + '</h4><div style="font-size:13px;opacity:.75">📅 ' + esc(s.date_text) + '<br>📍 ' + esc(s.venue) + '</div>' +
    '<div class="card2"><div><b>General Entry</b><div style="font-size:12px;opacity:.7">12 left · हिन्दी परीक्षण</div></div><b style="color:var(--paccent);font-size:18px">₹100</b></div>' +
    '<button class="btn2">Buy ticket</button><div class="fld">Your name</div><div class="fld">Phone number</div></div>';
}
ACT.thMode = function (d) { var p = d.m === 'light' ? LIGHT : DARK; TH = Object.assign({}, p, { radius: TH.radius, font: TH.font }); ['primary', 'background', 'card', 'text', 'accent', 'button_text'].forEach(function (k) { $('th_' + k).value = TH[k]; }); thDraw(); };
ACT.thReset = function () { TH = Object.assign({}, DARK); ['primary', 'background', 'card', 'text', 'accent', 'button_text'].forEach(function (k) { $('th_' + k).value = TH[k]; }); $('th_radius').value = TH.radius; $('th_font').value = TH.font; $('th_rv').textContent = TH.radius; thDraw(); toast('Default colours loaded. Press Save to apply.'); };
ACT.thSave = async function (d, b) {
  busy(b); var r = await sb.from('event_settings').update({ theme: TH, updated_at: new Date().toISOString() }).eq('id', 1); busy(b, false);
  if (r.error) return toast(errText(r.error), true); toast('Theme saved. The public page is updated.'); loadSettings();
};

// ───────────── TICKET DESIGN ─────────────
var TD = null, TDNAME = 'राहुल शर्मा, Asha Sharma, Bhavna';
T.ticket = async function () {
  await Promise.all([loadSettings(), loadTypes()]);
  TD = Object.assign({}, DEFAULT_TICKET, A.settings.ticket_design || {});
  var cf = [['strip_bg', 'Strip background'], ['strip_text', 'Strip text'], ['accent', 'Accent (lines, header)'], ['number_color', 'Ticket no. colour'], ['qr_color', 'QR colour']];
  var tg = [['show_type', 'Ticket type'], ['show_date', 'Date'], ['show_venue', 'Venue'], ['show_number', 'Ticket number'], ['show_logo', 'Logo']];
  $('content').innerHTML = '<h2>Ticket design</h2><div class="card muted">The artwork is your Dandiya Nights template. Edit the strip below it: colours, text and which details appear. The PDF follows the same settings. One ticket admits the whole group: write <b>{count}</b> in the header to show the number of people (ADMIT {count} \u2192 ADMIT 3).</div>' +
    '<h3>Preview</h3><div class="tkprev" id="tkPrev"></div>' +
    '<div class="row" style="margin:10px 0"><input id="td_name" style="flex:1;min-width:160px" value="' + esc(TDNAME) + '" oninput="TDNAME=this.value;tdDraw()" aria-label="Sample names, comma separated" placeholder="Sample names, comma separated"><button class="b sec" data-act="tdPdf">Preview as PDF</button></div>' +
    '<div class="card"><div class="colors">' + cf.map(function (c) { return '<div><label>' + c[1] + '</label><input type="color" id="td_' + c[0] + '" value="' + esc(TD[c[0]]) + '" oninput="tdRead()"></div>'; }).join('') + '</div>' +
    '<label>Header text</label><input id="td_header_text" value="' + esc(TD.header_text) + '" oninput="tdRead()">' +
    '<label>Footer note</label><input id="td_footer_note" value="' + esc(TD.footer_note) + '" oninput="tdRead()">' +
    '<label>Show on ticket</label>' + tg.map(function (g) { return '<label class="chk"><input type="checkbox" id="td_' + g[0] + '"' + (TD[g[0]] !== false && TD[g[0]] ? ' checked' : '') + ' onchange="tdRead()"> ' + g[1] + '</label>'; }).join('') +
    '<label>Ticket logo (uses the event logo if none uploaded)</label><input type="file" accept="image/*" onchange="tdLogo(this)" style="font-size:13px">' +
    '<div class="acts"><button class="b" data-act="tdSave">Save ticket design</button><button class="b sec" data-act="tdReset">Reset to default</button></div></div>';
  tdDraw();
};
function tdRead() {
  ['strip_bg', 'strip_text', 'accent', 'number_color', 'qr_color'].forEach(function (k) { TD[k] = val('td_' + k); });
  TD.header_text = val('td_header_text'); TD.footer_note = val('td_footer_note');
  ['show_type', 'show_date', 'show_venue', 'show_number', 'show_logo'].forEach(function (k) { TD[k] = $('td_' + k).checked; });
  tdDraw();
}
function tdCtx() {
  var t = A.types[0] || {};
  return { s: Object.assign({}, A.settings, { ticket_design: TD }), typeName: t.name || 'General Entry', accent: t.accent_color || null, bgUrl: 'assets/ticket-bg.jpg', logoUrl: pubUrl(TD.logo_path || A.settings.logo_path) };
}
function tdCount() { return TDNAME.split(',').filter(function (x) { return x.trim(); }).length || 1; }
function tdDraw() { $('tkPrev').innerHTML = renderTicketSVG({ code: 'TKT-ABCD234XYZ', attendee_name: TDNAME, count: tdCount() }, tdCtx()); }
async function tdLogo(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  try { TD.logo_path = await uploadBranding('ticket-logo', f, 500, 'png'); TD.show_logo = true; $('td_show_logo').checked = true; tdDraw(); toast('Logo added. Press Save to keep it.'); }
  catch (e) { toast(errText(e), true); }
}
ACT.tdReset = function () { TD = Object.assign({}, DEFAULT_TICKET); ['strip_bg', 'strip_text', 'accent', 'number_color', 'qr_color'].forEach(function (k) { $('td_' + k).value = TD[k]; }); $('td_header_text').value = TD.header_text; $('td_footer_note').value = TD.footer_note; ['show_type', 'show_date', 'show_venue', 'show_number', 'show_logo'].forEach(function (k) { $('td_' + k).checked = !!TD[k]; }); tdDraw(); toast('Default design loaded. Press Save to apply.'); };
ACT.tdSave = async function (d, b) {
  busy(b); var r = await sb.from('event_settings').update({ ticket_design: TD, updated_at: new Date().toISOString() }).eq('id', 1); busy(b, false);
  if (r.error) return toast(errText(r.error), true); toast('Ticket design saved.'); loadSettings();
};
ACT.tdPdf = async function (d, b) {
  busy(b);
  try {
    var t = A.types[0] || {}, ses = (await sb.auth.getSession()).data.session;
    var r = await fetch('/api/preview-pdf', { method: 'POST', headers: { 'Authorization': 'Bearer ' + ses.access_token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: TDNAME, count: tdCount(), type_name: t.name || 'General Entry', accent: t.accent_color || null, design: TD }) });
    if (!r.ok) { var j = await r.json().catch(function () { return {}; }); throw new Error(j.error || 'PDF failed (' + r.status + ')'); }
    dlBlob('ticket-preview.pdf', await r.blob());
  } catch (e) { toast(errText(e), true); }
  busy(b, false);
};

// ───────────── EMAIL TEMPLATES ─────────────
var ET = null;
var SAMPLE = { name: 'Asha Sharma', order_no: 'ORD-1001', event: '', date: '', venue: '', link: 'https://example.com/#/order/abc123', reason: 'Payment not found in our account', type: 'General Entry', qty: 2, amount: 200, contact_phone: '', contact_email: '', map: '' };
function fillTpl(str, v) { return String(str || '').replace(/\{(\w+)\}/g, function (m, k) { return v[k] != null ? v[k] : m; }); }
T.templates = async function () {
  await loadSettings();
  var r = await sb.rpc('admin_get_email_templates'); if (r.error) throw r.error;
  var cur = r.data || {}; ET = {};
  ['received', 'approved', 'rejected'].forEach(function (k) { ET[k] = Object.assign({}, DEFAULT_TEMPLATES[k], cur[k] || {}); });
  var titles = { received: 'Order received (sent when the buyer submits)', approved: 'Ticket (sent on approval, PDF attached)', rejected: 'Rejected (includes your reason)' };
  $('content').innerHTML = '<h2>Email text</h2><div class="card muted">Placeholders: <code>{name} {order_no} {event} {date} {venue} {link} {reason} {type} {qty} {amount} {contact_phone} {contact_email} {map}</code></div>' +
    ['received', 'approved', 'rejected'].map(function (k) {
      return '<div class="card"><b>' + titles[k] + '</b><label>Subject</label><input id="et_s_' + k + '" value="' + esc(ET[k].subject) + '" oninput="etRead()">' +
        '<label>Body</label><textarea id="et_b_' + k + '" style="min-height:170px" oninput="etRead()">' + esc(ET[k].body) + '</textarea>' +
        '<label>Preview</label><div class="emprev" id="et_p_' + k + '"></div><div class="acts"><button class="b sec sm" data-act="etDef" data-k="' + k + '">Reset this email to default</button></div></div>';
    }).join('') + '<div class="sticky-save"><button class="b" style="width:100%" data-act="etSave">Save email text</button></div>';
  etDraw();
};
function etRead() { ['received', 'approved', 'rejected'].forEach(function (k) { ET[k] = { subject: val('et_s_' + k), body: val('et_b_' + k) }; }); etDraw(); }
function etDraw() {
  var v = Object.assign({}, SAMPLE, { event: A.settings.name, date: A.settings.date_text, venue: A.settings.venue, contact_phone: A.settings.contact_phone, contact_email: A.settings.contact_email, map: (venueMap(A.settings) || {}).link || '' });
  ['received', 'approved', 'rejected'].forEach(function (k) {
    $('et_p_' + k).innerHTML = '<b>' + esc(fillTpl(ET[k].subject, v)) + '</b>\n\n' + esc(fillTpl(ET[k].body, v));
  });
}
ACT.etDef = function (d) { $('et_s_' + d.k).value = DEFAULT_TEMPLATES[d.k].subject; $('et_b_' + d.k).value = DEFAULT_TEMPLATES[d.k].body; etRead(); };
ACT.etSave = async function (d, b) {
  etRead(); busy(b); var r = await sb.from('event_settings').update({ email_templates: ET, updated_at: new Date().toISOString() }).eq('id', 1); busy(b, false);
  if (r.error) return toast(errText(r.error), true); toast('Email text saved.');
};

// ───────────── STAFF ─────────────
T.staff = async function () {
  var r = await api('/api/staff', null, 'GET');
  if (r.error) throw new Error(r.error);
  $('content').innerHTML = '<h2>Scanner staff</h2><div class="card muted">Gate volunteers sign in to the scanner site with these logins. Remove a login to revoke access immediately — your admin account is not affected.' +
    (SCANNER_URL ? '<br>Scanner site: <a href="' + esc(SCANNER_URL) + '" target="_blank" rel="noopener">' + esc(SCANNER_URL) + '</a>' : '') + '</div>' +
    '<div class="card"><b>Add scanner login</b><label>Name</label><input id="st_name"><label>Email</label><input id="st_email" type="email" inputmode="email" autocomplete="off">' +
    '<label>Password (min 8 characters)</label><input id="st_pw" type="text" autocomplete="off"><div id="st_err" class="err"></div><button class="b" data-act="stAdd">Create login</button></div>' +
    (r.staff.map(function (u) {
      return '<div class="card row"><div style="min-width:0"><b>' + esc(u.name || u.email) + '</b><div class="muted">' + esc(u.email) + '<br>Last sign-in: ' + (u.last_sign_in_at ? fmt(u.last_sign_in_at) : 'never') + '</div></div><button class="b bad sm" data-act="stDel" data-id="' + esc(u.id) + '" data-em="' + esc(u.email) + '">Remove</button></div>';
    }).join('') || '<div class="card muted" style="text-align:center">No scanner logins yet.</div>');
};
ACT.stAdd = async function (d, b) {
  var e = $('st_err'); e.textContent = ''; busy(b);
  var r = await api('/api/staff', { name: val('st_name'), email: val('st_email'), password: val('st_pw') });
  if (!r.ok) { e.textContent = r.error || 'Failed'; busy(b, false); return; }
  toast('Scanner login created.'); T.staff();
};
ACT.stDel = async function (d, b) {
  if (!confirm('Remove the login for ' + d.em + '? They will be signed out of the scanner.')) return;
  busy(b); var r = await api('/api/staff', { id: d.id }, 'DELETE');
  if (!r.ok) { toast(r.error || 'Failed', true); busy(b, false); return; }
  toast('Login removed.'); T.staff();
};

boot();
</script>
