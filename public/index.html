<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Tickets</title>
<meta name="theme-color" content="#1f0823">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Noto fonts are always loaded: the on-screen ticket uses them so it matches the PDF (Hindi names too) -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet">
<link id="themeFont" rel="stylesheet" href="">
<style>
  :root{
    --primary:#f5b83d; --bg:#1f0823; --card:#321037; --text:#fdf3e3; --accent:#f5cc6a; --btntext:#2b0a30;
    --radius:14px; --font:'Poppins','Noto Sans Devanagari',sans-serif;
    --muted:color-mix(in srgb, var(--text) 68%, transparent);
    --line:color-mix(in srgb, var(--text) 16%, transparent);
    --field:color-mix(in srgb, var(--text) 8%, var(--card));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh;
       padding-bottom:env(safe-area-inset-bottom)}
  a{color:var(--accent)}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
  .banner{width:100%;aspect-ratio:16/7;object-fit:cover;display:block;background:var(--card)}
  .hero{padding:18px 0 4px;text-align:center}
  .logo{width:72px;height:72px;object-fit:contain;border-radius:calc(var(--radius) - 2px);margin:-44px auto 8px;display:block;background:var(--card);border:2px solid var(--bg)}
  h1{font-size:28px;line-height:1.15;margin:6px 0 8px;color:var(--accent)}
  h2{font-size:18px;margin:26px 0 10px}
  .meta{color:var(--muted);font-size:14px;margin:2px 0}
  .desc{white-space:pre-wrap;margin:14px 0;color:var(--text)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
  .row{display:flex;gap:12px;align-items:center;justify-content:space-between}
  .tname{font-weight:600;font-size:17px}
  .price{font-weight:700;font-size:20px;color:var(--accent);white-space:nowrap}
  .sub{color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line)}
  .pill.ok{background:#1e6b3a33;border-color:#2fb36a;color:#6ee7a0}
  .pill.warn{background:#a8700033;border-color:#e0a030;color:#ffd27a}
  .pill.bad{background:#8a1c1c33;border-color:#e05555;color:#ff9a9a}
  button,.btn{font-family:inherit;font-size:16px;font-weight:600;border:0;border-radius:var(--radius);padding:13px 18px;cursor:pointer;
       background:var(--primary);color:var(--btntext);text-decoration:none;display:inline-block;text-align:center}
  button:disabled{opacity:.55;cursor:default}
  .btn.ghost,button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.block,button.block{display:block;width:100%}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;color:var(--muted)}
  input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);
       border-radius:calc(var(--radius) - 4px);padding:12px;outline:none}
  input:focus,select:focus{border-color:var(--primary)}
  input.bad{border-color:#ff6b6b}
  .err{background:#8a1c1c44;border:1px solid #e05555;color:#ffb3b3;border-radius:calc(var(--radius) - 4px);padding:10px 12px;margin:14px 0;font-size:14px;display:none}
  .err.show{display:block}
  .steps{display:flex;gap:6px;margin:16px 0}
  .steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
  .steps i.on{background:var(--primary)}
  .steplabel{font-size:13px;color:var(--muted);margin-bottom:2px}
  .terms{font-size:13px;color:var(--muted);white-space:pre-wrap;border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
  .total{font-size:34px;font-weight:700;color:var(--accent);text-align:center;margin:6px 0}
  .qr{display:block;margin:10px auto;width:min(280px,80%);aspect-ratio:1;object-fit:contain;background:#fff;border-radius:12px;padding:8px}
  .instr{white-space:pre-wrap;font-size:14px;color:var(--text)}
  .tick{margin:14px 0;border-radius:calc(var(--radius) - 2px);overflow:hidden;border:1px solid var(--line)}
  .thumb{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:10px auto}
  .center{text-align:center}
  .loading{padding:70px 0;text-align:center;color:var(--muted)}
  .back{background:none;border:0;color:var(--muted);padding:14px 0 0;font-size:14px;cursor:pointer;font-family:inherit}
  .footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .nameRow{display:flex;gap:8px;align-items:center}
  .nameRow span{min-width:22px;color:var(--muted);font-size:13px}
  .person{border:1px solid var(--line);border-radius:calc(var(--radius) - 4px);padding:10px;margin-bottom:10px}
  .idUp{display:flex;align-items:center;gap:10px;margin:8px 0 0;padding:10px;border:1px dashed var(--line);border-radius:calc(var(--radius) - 6px);
        color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
  .idUp img{width:46px;height:46px;object-fit:cover;border-radius:6px}
  .idUp.ok{border-style:solid;border-color:#2fb36a}
  .idUp.bad{border-color:#ff6b6b}
  .hidden{display:none}
  .notice{border-left:4px solid var(--accent)}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:500;color:var(--text);margin:14px 0}
  .chk input{width:22px;height:22px;flex:0 0 auto;margin-top:1px}
  /* ═════════ Landing page (event page only) — festive canopy theme from the moodboard ═════════
     Art colours are fixed (they are the décor); buttons/cards still follow the admin theme. */
  :root{
    --f-magenta:#e0217a; --f-orange:#ff7a1a; --f-teal:#16a9a2; --f-red:#d42a2f; --f-gold:#f7c948; --f-green:#6fbf3f; --f-blue:#2a5fd6;
    --f-night:#13040f; --f-display:'Yatra One','Noto Sans Devanagari',serif;
  }
  .lp{background:var(--bg)}
  .lp-hero{position:relative;min-height:min(92svh,780px);overflow:hidden;background:var(--f-night);isolation:isolate;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 16px 96px}
  .lp-canopy{position:absolute;inset:0;z-index:-3;
    background:
      repeating-conic-gradient(from -3deg at 50% 36%, rgba(0,0,0,.28) 0deg .5deg, transparent .5deg 6deg),
      repeating-conic-gradient(from -3deg at 50% 36%, var(--f-magenta) 0 6deg, var(--f-orange) 6deg 12deg, var(--f-teal) 12deg 18deg,
        var(--f-red) 18deg 24deg, var(--f-gold) 24deg 30deg, var(--f-green) 30deg 36deg, var(--f-blue) 36deg 42deg)}
  .lp-canopy.photo{background-size:cover;background-position:center}
  .lp-shade{position:absolute;inset:0;z-index:-2;
    background:radial-gradient(ellipse 70% 52% at 50% 50%, rgba(19,4,15,.90) 0%, rgba(19,4,15,.72) 45%, rgba(19,4,15,.25) 75%, rgba(19,4,15,.55) 100%),
               linear-gradient(180deg, rgba(19,4,15,.35), transparent 30%, transparent 70%, rgba(19,4,15,.85))}
  .lp-lights{position:absolute;inset:0;z-index:-1;pointer-events:none}
  .lp-lights i{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#fff6c8;
    box-shadow:0 0 6px 2px rgba(255,214,102,.85),0 0 14px 4px rgba(255,170,40,.35);animation:lpTwinkle 3.2s ease-in-out infinite}
  @keyframes lpTwinkle{0%,100%{opacity:1}50%{opacity:.35}}
  .lp-umb{position:absolute;top:0;z-index:-1;transform-origin:50% 0;animation:lpSway 5s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  @keyframes lpSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .lp-logo{width:84px;height:84px;border-radius:50%;object-fit:contain;background:#fff;padding:6px;margin-bottom:14px;
    box-shadow:0 0 0 3px var(--f-gold),0 0 0 7px rgba(247,201,72,.25),0 8px 24px rgba(0,0,0,.5)}
  .lp-eyebrow{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#ffe7a8;margin-bottom:6px;font-weight:600}
  .lp-title{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,14vw,96px);line-height:1.02;margin:0 0 14px;
    background:linear-gradient(180deg,#fff3c4 0%,#f7c948 45%,#e89a1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 28px rgba(247,201,72,.25);text-wrap:balance}
  .lp-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
  .lp-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:#fff8e6;
    background:rgba(19,4,15,.55);border:1px solid rgba(247,201,72,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .lp-chip svg{width:17px;height:17px;flex:0 0 auto;color:var(--f-gold)}
  .lp-cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 28px;border-radius:999px;border:0;cursor:pointer;
    font:inherit;font-size:17px;font-weight:700;color:var(--btntext);text-decoration:none;
    background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 60%,var(--f-orange)));
    box-shadow:0 10px 26px rgba(247,160,40,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s ease,box-shadow .15s ease}
  .lp-cta:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(247,160,40,.45)}
  .lp-cta:active{transform:translateY(1px)}
  .lp-cta:focus-visible,.lp-btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .lp-cta svg{width:20px;height:20px}
  .lp-from{margin-top:10px;font-size:14px;color:#ffe7c2}
  .lp-closed{display:inline-block;padding:10px 18px;border-radius:12px;background:rgba(19,4,15,.7);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:600}
  .lp-toran{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:46px;z-index:1;display:block}
  .lp-wrap{max-width:680px;margin:0 auto;padding:6px 16px 120px}
  .lp-sec{margin-top:34px}
  .lp-h{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 14px;color:var(--accent)}
  .lp-h::before,.lp-h::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 12px);opacity:.55}
  .lp-h span{display:inline-flex;align-items:center;gap:10px}
  .lp-mirror{display:inline-block;width:12px;height:12px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 35% 35%,#fff 0 22%,#cfd6e6 23% 46%,#8f9bb3 47% 58%,var(--f-magenta) 59% 100%)}
  .lp-about{font-size:16px;line-height:1.65;white-space:pre-wrap;color:var(--text);text-align:center;margin:0}
  .lp-pass{position:relative;border-radius:calc(var(--radius) + 4px);padding:20px 18px 18px;margin:0 0 16px;overflow:hidden;
    background:linear-gradient(160deg,color-mix(in srgb,var(--card) 92%,var(--f-magenta)),var(--card));
    border:2px solid color-mix(in srgb,var(--pass-accent,var(--accent)) 70%,transparent);box-shadow:0 12px 28px rgba(0,0,0,.28)}
  .lp-pass::before{content:"";position:absolute;inset:7px;border:2px dashed color-mix(in srgb,var(--pass-accent,var(--accent)) 45%,transparent);border-radius:var(--radius);pointer-events:none}
  .lp-pass::after{content:"";position:absolute;right:-26px;top:-26px;width:92px;height:92px;border-radius:50%;opacity:.2;pointer-events:none;
    background:repeating-conic-gradient(var(--f-gold) 0 15deg,transparent 15deg 30deg)}
  .lp-pass-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .lp-pass-name{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;color:var(--text);margin:0}
  .lp-pass-desc{color:var(--muted);font-size:14px;margin-top:4px}
  .lp-price{text-align:right;flex:0 0 auto}
  .lp-price b{display:block;font-size:30px;line-height:1;color:var(--accent);font-weight:800}
  .lp-price small{font-size:12px;color:var(--muted)}
  .lp-seats{margin:16px 0 14px;font-size:13px;color:var(--muted)}
  .lp-seatbar{height:8px;border-radius:8px;background:color-mix(in srgb,var(--text) 12%,transparent);overflow:hidden;margin-top:6px}
  .lp-seatbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--f-teal),var(--f-gold),var(--f-magenta))}
  .lp-seats.low{color:#ffd27a}
  .lp-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:calc(var(--radius) - 2px);cursor:pointer;
    font:inherit;font-size:16px;font-weight:700;color:var(--btntext);background:var(--primary);text-decoration:none;transition:filter .15s ease,transform .15s ease}
  .lp-btn:hover{filter:brightness(1.06)}
  .lp-btn:active{transform:translateY(1px)}
  .lp-btn svg{width:19px;height:19px}
  .lp-btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .lp-sold{display:inline-block;background:var(--f-red);color:#fff;font-weight:800;font-size:12px;letter-spacing:.12em;padding:4px 10px;border-radius:6px;margin-bottom:8px}
  .lp-pass.sold{opacity:.72}
  .lp-pass.sold .lp-price b{text-decoration:line-through;text-decoration-thickness:2px}
  .lp-note{text-align:center;color:var(--muted);font-size:13px;margin-top:-4px}
  .lp-sample{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.35)}
  .lp-rules{list-style:none;margin:0;padding:16px 16px 6px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line)}
  .lp-rules li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5;margin:0 0 12px}
  .lp-rules .lp-mirror{margin-top:5px}
  .lp-contact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lp-contact .lp-btn{font-size:15px}
  .lp-foot{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
  .lp-foot svg{display:block;margin:0 auto 10px;width:220px;height:46px}
  .lp-sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,transparent,rgba(19,4,15,.92) 30%);transform:translateY(110%);transition:transform .25s ease}
  .lp-sticky.show{transform:none}
  .lp-sticky .lp-cta{width:100%;max-width:640px;display:flex;margin:0 auto}
  .lp-reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
  .lp-reveal.in{opacity:1;transform:none}
  @media (min-width:700px){ .lp-hero{padding-top:96px} .lp-h{font-size:30px} }
  @media (prefers-reduced-motion:reduce){
    .lp-lights i,.lp-umb{animation:none}
    .lp-reveal{opacity:1;transform:none;transition:none}
    .lp-sticky,.lp-cta,.lp-btn{transition:none}
  }
</style>
</head>

<div id="app"><div class="loading">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ───────────── CONFIG (edit these three lines) ─────────────
var SUPABASE_URL = 'https://iuvxavsuoiekrjnylxpy.supabase.co';
var SUPABASE_KEY = 'sb_publishable_RAac6qm2v3UEhQx4H4DJ-Q_xxuPy9mv';   // publishable (anon) key: safe in the browser
var API_BASE     = 'https://spseventadmin.vercel.app';            // admin project URL (only its /api/ functions are called)
// ───────────────────────────────────────────────────────────

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
var S = { settings: null, types: [], route: null };   // S.settings = public event_settings row
var B = null;                                          // buy-form state
var pollTimer = null;
var MY_KEY = 'tk_my_orders';
var SETTINGS_COLS = 'id,name,date_text,venue,description,contact_phone,contact_email,payment_instructions,terms_text,sales_open,sales_start,sales_end,closed_message,max_per_order,logo_path,banner_path,payment_qr_path,instructions_text,theme,ticket_design';
var FONTS = {
  'Poppins': 'Poppins:wght@400;500;600;700', 'Inter': 'Inter:wght@400;500;600;700',
  'Playfair Display': 'Playfair+Display:wght@400;600;700', 'Hind': 'Hind:wght@400;500;600;700',
  'Noto Sans Devanagari': 'Noto+Sans+Devanagari:wght@400;500;600;700'
};

// <ticket-svg>
// MASTER COPY of the on-screen ticket renderer. It is inlined into public/index.html and admin/index.html
// between the "<ticket-svg>" markers by tools/sync-ticket-svg.py (edit here, then run that script).
// Keep the geometry identical to drawTicket() in admin/api/_pdf.js so screen and PDF look the same.
var TK_W = 1000, TK_ART_H = 780 / 2016 * 1000, TK_STRIP_H = 170, TK_H = TK_ART_H + TK_STRIP_H;
function tkEsc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function tkHex(c, d) { return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : d; }
function tkFit(text, size, maxW, bold, min) {
  var k = bold ? 0.66 : 0.6, s = size;
  while (s > (min || 14) && text.length * s * k > maxW) s -= 1;
  if (text.length * s * k > maxW) text = text.slice(0, Math.max(1, Math.floor(maxW / (s * k)) - 1)) + '…';
  return { text: text, size: s };
}
// t: {code, attendee_name (all names, comma separated), count}; c: {s: event settings, typeName, accent, logoUrl, bgUrl}
function renderTicketSVG(t, c) {
  var s = c.s || {}, d = s.ticket_design || {};
  var stripBg = tkHex(d.strip_bg, '#2b0a30'), stripText = tkHex(d.strip_text, '#fff4e0');
  var accent = tkHex(c.accent, tkHex(d.accent, '#f5cc6a'));
  var numColor = tkHex(d.number_color, '#f9d77a'), qrColor = tkHex(d.qr_color, '#2b0a30');
  var FF = "font-family=\"'Noto Sans','Noto Sans Devanagari',sans-serif\"";
  var qr = qrcode(0, 'M'); qr.addData(t.code); qr.make();
  var n = qr.getModuleCount(), cell = 100 / n, qp = '', r, q;
  for (r = 0; r < n; r++) for (q = 0; q < n; q++) {
    if (qr.isDark(r, q)) qp += 'M' + (57.1 + q * cell).toFixed(2) + ' ' + (162.3 + r * cell).toFixed(2) + 'h' + (cell + 0.05).toFixed(2) + 'v' + (cell + 0.05).toFixed(2) + 'h-' + (cell + 0.05).toFixed(2) + 'z';
  }
  var y0 = TK_ART_H, tx = 36, o = '';
  o += '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + TK_W + ' ' + TK_H.toFixed(2) + '" width="100%" style="display:block" role="img" aria-label="Ticket ' + tkEsc(t.code) + '">';
  o += '<image href="' + tkEsc(c.bgUrl) + '" x="0" y="0" width="' + TK_W + '" height="' + TK_ART_H.toFixed(2) + '" preserveAspectRatio="none"/>';
  if (d.show_number !== false) {
    o += '<text x="106.6" y="95" text-anchor="middle" font-size="19" letter-spacing="2.5" fill="' + numColor + '" ' + FF + '>' + tkEsc(t.code.replace(/^TKT-/, '')) + '</text>';
  }
  o += '<path d="' + qp + '" fill="' + qrColor + '"/>';
  o += '<rect x="0" y="' + y0.toFixed(2) + '" width="' + TK_W + '" height="' + TK_STRIP_H + '" fill="' + stripBg + '"/>';
  o += '<rect x="0" y="' + y0.toFixed(2) + '" width="' + TK_W + '" height="5" fill="' + accent + '"/>';
  if (d.show_logo && c.logoUrl) {
    o += '<image href="' + tkEsc(c.logoUrl) + '" x="36" y="' + (y0 + 37).toFixed(2) + '" width="96" height="96" preserveAspectRatio="xMidYMid meet"/>';
    tx = 154;
  }
  var maxW = 964 - tx, f;
  var header = String(d.header_text || '').replace(/\{count\}/g, String(t.count || 1));   // "ADMIT {count}" -> "ADMIT 3"
  if (header) {
    f = tkFit(header, 15, maxW, false, 11);
    o += '<text x="' + tx + '" y="' + (y0 + 38).toFixed(2) + '" font-size="' + f.size + '" letter-spacing="3" fill="' + accent + '" ' + FF + '>' + tkEsc(f.text) + '</text>';
  }
  f = tkFit(t.attendee_name || '', 40, maxW, true, 20);
  o += '<text x="' + tx + '" y="' + (y0 + 88).toFixed(2) + '" font-size="' + f.size + '" font-weight="700" fill="' + stripText + '" ' + FF + '>' + tkEsc(f.text) + '</text>';

function scrollToTickets() {

// Fade-in on scroll + sticky "Book" bar once the hero button is out of view
function lpObserve() {
  var els = document.querySelectorAll('.lp-reveal');
  if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -8% 0px' });
  els.forEach(function (e) { io.observe(e); });
  var cta = $('heroCta'), bar = $('lpSticky'), tk = $('tickets');
  if (cta && bar) {
    var seen = { cta: true, tickets: false };
    var upd = function () { bar.classList.toggle('show', !seen.cta && !seen.tickets); };
    new IntersectionObserver(function (es) { es.forEach(function (e) { seen[e.target === cta ? 'cta' : 'tickets'] = e.isIntersecting; }); upd(); }).observe(cta);
    if (tk) new IntersectionObserver(function (es) { es.forEach(function (e) { seen.tickets = e.isIntersecting; }); upd(); }, { rootMargin: '0px 0px -40% 0px' }).observe(tk);
  }
}

    h += '<label for="f_qty">Number of people (' + t.remaining + ' places left)</label><select id="f_qty" onchange="onQty()">' + opts + '</select>';
    h += '<label for="f_name">Your name</label><input id="f_name" autocomplete="name" value="' + esc(B.name) + '" oninput="onBuyerName()">';
    h += '<label for="f_phone">Phone number</label><input id="f_phone" type="tel" inputmode="tel" autocomplete="tel" value="' + esc(B.phone) + '">';
    h += '<label for="f_email">Email (your ticket is sent here)</label><input id="f_email" type="email" inputmode="email" autocomplete="email" value="' + esc(B.email) + '">';
    h += '<label for="f_email2">Confirm email</label><input id="f_email2" type="email" inputmode="email" autocomplete="off" value="' + esc(B.email2) + '">';
    h += '<div id="namesBox"></div>';
    if (s.instructions_text) {
      h += '<div class="card notice"><div class="tname">Please read</div><div class="instr" style="margin-top:6px">' + esc(s.instructions_text) + '</div></div>' +
           '<label class="chk" id="f_agree_l"><input type="checkbox" id="f_agree"' + (B.agree ? ' checked' : '') + '> I have read and agree to the instructions</label>';
    }
    h += '<div id="err" class="err"></div><button class="block" onclick="toStep2()">Continue to payment</button>';
    if (s.terms_text) h += '<div class="terms">' + esc(s.terms_text) + '</div>';
  } else if (B.step === 2) {
    var total = t.price * B.qty, payQr = s.payment_qr_path || t.payment_qr_path;   // one event QR; old per-type QR as fallback
    h += '<div class="card"><div class="center sub">Pay exactly</div><div class="total">' + rupees(total) + '</div><div class="center sub">' + B.qty + ' × ' + rupees(t.price) + '</div>' +
      (payQr ? '<img class="qr" src="' + esc(pubUrl(payQr)) + '" alt="UPI QR code">' : '<p class="center sub">Payment QR is not set up yet. Please contact the organiser.</p>') +
      '<div class="center sub" style="margin-bottom:8px">Paying from this phone? Take a screenshot of the QR, then in your UPI app choose “Scan from gallery”.</div></div>';
    if (s.payment_instructions) h += '<div class="card instr">' + esc(s.payment_instructions) + '</div>';
    h += '<label for="f_payer">Name shown in your payment app</label><input id="f_payer" autocomplete="off" value="' + esc(B.payer) + '" placeholder="Exactly as your UPI app shows it">';
    h += '<div id="err" class="err"></div><button class="block" onclick="toStep3()">I have paid — continue</button>';
  } else {
    h += '<div class="card"><b>Upload your payment screenshot</b><div class="sub">Used only as a reference so we can verify your payment.</div>' +
      '<input id="f_shot" type="file" accept="image/*" style="margin-top:12px" onchange="onShot(this)">' +
      '<div id="shotPrev">' + (B.shotUrl ? '<img class="thumb" src="' + B.shotUrl + '" alt="screenshot preview">' : '') + '</div></div>';
    h += '<div class="card sub">' + B.qty + ' × ' + esc(t.name) + ' = <b>' + rupees(t.price * B.qty) + '</b><br>Payer name: <b>' + esc(B.payer) + '</b></div>';
    h += '<div id="err" class="err"></div><button id="submitBtn" class="block" onclick="submitOrder()">Submit order</button>';
  }
  $('app').innerHTML = shell(h);
  if (B.step === 1) drawNames();
}

function drawNames() {
  var h = '<label>Everyone on this ticket</label><div class="sub" style="margin-bottom:8px">One ticket admits all these people together. Enter each name as on the Aadhaar card and add a photo of that person\'s Aadhaar. Only the organiser can see it; a masked Aadhaar is fine.</div>';
  for (var i = 0; i < B.qty; i++) {
    h += '<div class="person"><div class="nameRow"><span>' + (i + 1) + '.</span><input id="f_n' + i + '" placeholder="Person ' + (i + 1) + ' full name" value="' + esc(B.names[i] || '') + '" oninput="onAttName(' + i + ')"></div>' +
      '<label class="idUp' + (B.ids[i] ? ' ok' : '') + '" id="f_idl' + i + '" for="f_id' + i + '">' +
      (B.idUrls[i] ? '<img src="' + B.idUrls[i] + '" alt="">\u2714 Aadhaar added \u00B7 tap to change' : '\uD83D\uDCCE Add Aadhaar photo') + '</label>' +
      '<input type="file" accept="image/*" id="f_id' + i + '" class="hidden" onchange="onId(' + i + ',this)"></div>';
  }
  $('namesBox').innerHTML = h;
}
function onQty() {
  B.qty = Number($('f_qty').value);
  while (B.names.length < B.qty) B.names.push('');
  B.names.length = B.qty; B.ids.length = B.qty; B.idUrls.length = B.qty;
  drawNames();
}
async function onId(i, inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  try {
    B.ids[i] = await compress(f, 1400);          // larger than the screenshot so the card stays readable
    if (B.idUrls[i]) URL.revokeObjectURL(B.idUrls[i]);
    B.idUrls[i] = URL.createObjectURL(B.ids[i]);
    drawNames();
    if ($('err')) $('err').className = 'err';
  } catch (e) { showErr(e.message, 'f_idl' + i); }
}
function onBuyerName() {
  B.name = $('f_name').value;
  if (!B.firstEdited) { B.names[0] = B.name; var el = $('f_n0'); if (el) el.value = B.name; }
}
function onAttName(i) {
  B.names[i] = $('f_n' + i).value;
  if (i === 0 && $('f_n0').value !== B.name) B.firstEdited = true;
}
function showErr(msg, fieldId) {
  var e = $('err'); if (!e) return;
  e.textContent = msg; e.className = 'err show';
  document.querySelectorAll('.bad').forEach(function (x) { x.classList.remove('bad'); });
  var f = fieldId && $(fieldId);
  if (f) { f.classList.add('bad'); f.focus(); }
  e.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function buyStep(n) { readStep(); B.step = n; drawBuy(); window.scrollTo(0, 0); }
function readStep() {
  if (B.step === 1) {
    B.qty = Number($('f_qty').value); B.name = $('f_name').value; B.phone = $('f_phone').value;
    B.email = $('f_email').value; B.email2 = $('f_email2').value;
    for (var i = 0; i < B.qty; i++) { var el = $('f_n' + i); if (el) B.names[i] = el.value; }
    B.agree = !!($('f_agree') && $('f_agree').checked);
  } else if (B.step === 2) { B.payer = $('f_payer').value; }
}
function validEmail(e) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e); }

function toStep2() {
  readStep();
  var t = curType();
  if (B.qty < 1 || B.qty > maxQty(t)) return showErr('Choose between 1 and ' + maxQty(t) + ' tickets.', 'f_qty');
  if (B.name.trim().length < 2) return showErr('Please enter your name.', 'f_name');
  if (B.phone.replace(/\D/g, '').length < 10) return showErr('Enter a phone number with at least 10 digits.', 'f_phone');
  if (!validEmail(B.email.trim())) return showErr('Enter a valid email address.', 'f_email');
  if (B.email.trim().toLowerCase() !== B.email2.trim().toLowerCase()) return showErr('The two email addresses do not match.', 'f_email2');
  for (var i = 0; i < B.qty; i++) {
    if ((B.names[i] || '').trim().length < 2) return showErr('Enter the full name of person ' + (i + 1) + '.', 'f_n' + i);
    if (!B.ids[i]) return showErr('Add the Aadhaar photo for person ' + (i + 1) + ' (' + B.names[i].trim() + ').', 'f_idl' + i);
  }
  if (S.settings.instructions_text && !B.agree) return showErr('Please tick that you have read and agree to the instructions.', 'f_agree_l');
  B.step = 2; drawBuy(); window.scrollTo(0, 0);
}
function toStep3() {
  readStep();
  if (B.payer.trim().length < 2) return showErr('Enter the name shown in your payment app.', 'f_payer');
  B.step = 3; drawBuy(); window.scrollTo(0, 0);
}

// Resize to ~900px (screenshots) / ~1400px (Aadhaar) JPEG before upload
function compress(file, maxDim) {
  maxDim = maxDim || 900;
  return new Promise(function (resolve, reject) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var sc = Math.min(1, maxDim / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? resolve(b) : reject(new Error('Could not process the image')); }, 'image/jpeg', 0.8);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That file is not a readable image')); };
    img.src = url;
  });
}
async function onShot(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  try {
    B.shot = await compress(f);
    if (B.shotUrl) URL.revokeObjectURL(B.shotUrl);
    B.shotUrl = URL.createObjectURL(B.shot);
    $('shotPrev').innerHTML = '<img class="thumb" src="' + B.shotUrl + '" alt="screenshot preview">';
    if ($('err')) $('err').className = 'err';
  } catch (e) { B.shot = null; showErr(e.message); }
}
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
var ERR_MAP = {
  SALES_CLOSED: 'Ticket sales are closed.', SOLD_OUT: 'Sorry, these tickets just sold out.',
  TYPE_UNAVAILABLE: 'This ticket type is no longer available.', TOO_MANY_PENDING: 'You already have several orders waiting for verification with this email. Please wait for them to be approved.',
  BAD_NAME: 'Please check your name.', BAD_PHONE: 'Please check your phone number.', BAD_EMAIL: 'Please check your email address.',
  BAD_PAYER: 'Please check the name shown in your payment app.', BAD_ATTENDEES: 'Please check the names on the tickets.',
  BAD_SCREENSHOT: 'The screenshot upload did not work. Please choose the image again.',
  BAD_IDS: 'An Aadhaar photo did not upload. Please go back and add it again.', BAD_QTY: 'Please check the number of tickets.'
};
function friendly(e) {
  var m = String(e && e.message || e), code = m.split(':')[0], arg = m.split(':')[1];
  if (code === 'NOT_ENOUGH_SEATS') return 'Only ' + arg + ' seat' + (arg === '1' ? '' : 's') + ' left. Please reduce the number of tickets.';
  if (code === 'MAX_PER_ORDER') return 'You can buy at most ' + arg + ' tickets per order.';
  if (code === 'BAD_IDS' && arg) return 'The Aadhaar photo for person ' + arg + ' did not upload. Please go back and add it again.';
  return ERR_MAP[code] || 'Could not place your order: ' + m;
}

async function submitOrder() {
  if (B.busy) return;
  if (!B.shot) return showErr('Please upload your payment screenshot.', 'f_shot');
  var btn = $('submitBtn'), t = curType();
  B.busy = true; btn.disabled = true; btn.textContent = 'Checking seats…';
  try {
    // re-check availability and sale window right before submitting
    await Promise.all([loadTypes(), loadSettings()]);
    if (salesState(S.settings) !== 'open') throw new Error('SALES_CLOSED');
    var fresh = S.types.filter(function (x) { return x.id === t.id; })[0];
    if (!fresh || fresh.remaining <= 0) throw new Error('SOLD_OUT');
    if (fresh.remaining < B.qty) throw new Error('NOT_ENOUGH_SEATS:' + fresh.remaining);

    btn.textContent = 'Uploading screenshot…';
    var path = uuid() + '.jpg';
    var up = await sb.storage.from('screenshots').upload(path, B.shot, { contentType: 'image/jpeg', upsert: false });
    if (up.error) throw new Error('BAD_SCREENSHOT');

    var idPaths = [];
    for (var i = 0; i < B.qty; i++) {
      btn.textContent = 'Uploading Aadhaar ' + (i + 1) + ' of ' + B.qty + '…';
      var ip = uuid() + '.jpg';
      var iu = await sb.storage.from('ids').upload(ip, B.ids[i], { contentType: 'image/jpeg', upsert: false });
      if (iu.error) throw new Error('BAD_IDS:' + (i + 1));
      idPaths.push(ip);
    }

    btn.textContent = 'Placing order…';
    var r = await sb.rpc('create_order', {
      p_type_id: t.id, p_qty: B.qty, p_buyer_name: B.name.trim(), p_email: B.email.trim(), p_phone: B.phone.trim(),
      p_payer_name: B.payer.trim(), p_screenshot_path: path, p_names: B.names.slice(0, B.qty).map(function (n) { return n.trim(); }),
      p_id_paths: idPaths
    });
    if (r.error) throw r.error;
    var token = r.data;
    var mine = lsGet(MY_KEY, []); mine.unshift({ token: token, at: Date.now() }); lsSet(MY_KEY, mine.slice(0, 20));
    if (API_BASE.indexOf('YOUR-') < 0) {       // "order received" email; failure must never block the buyer
      try { fetch(API_BASE + '/api/order-received', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }), keepalive: true }); } catch (e) {}
    }
    B = null;
    go('#/order/' + token);
  } catch (e) {
    B.busy = false; btn.disabled = false; btn.textContent = 'Submit order';
    showErr(friendly(e));
    if (/SOLD_OUT|NOT_ENOUGH|SALES_CLOSED|TYPE_UNAVAIL/.test(String(e.message))) { btn.textContent = 'Go back'; btn.onclick = function () { go('#/'); }; }
  }
}

// ───────────── private order page ─────────────
async function viewOrder(token) {
  try { if (!S.settings) await loadSettings(); await loadSettings(); } catch (e) { return fail(e); }
  var r = await sb.rpc('get_order', { p_token: token });
  if (r.error) return fail(r.error);
  var o = r.data;
  if (!o) { $('app').innerHTML = shell('<div class="card center">We could not find this order.<br><br><a class="btn ghost" href="#/">Back to event</a></div>'); return; }
  var mine = lsGet(MY_KEY, []);
  if (!mine.some(function (m) { return m.token === token; })) { mine.unshift({ token: token, at: Date.now() }); lsSet(MY_KEY, mine.slice(0, 20)); }

  var s = S.settings, h = '<button class="back" style="padding-top:0" onclick="go(\'#/\')">← Back to event</button><h1 style="font-size:24px;margin-top:10px">' + esc(o.order_no) + '</h1>';
  h += '<div class="card"><div class="row"><div><div class="tname">' + esc(o.qty) + ' × ' + esc(o.type_name) + '</div><div class="sub">' + esc(o.buyer_name) + ' · ' + esc(o.email) + '</div></div><div class="price">' + rupees(o.amount) + '</div></div></div>';
  if (o.status === 'pending') {
    h += '<div class="card center"><span class="pill warn">Verifying payment</span><p>We are verifying your payment. Your ticket will be emailed to <b>' + esc(o.email) + '</b> once it is approved.</p><p class="sub">This page updates by itself. Keep this link — it is private to you.</p></div>';
  } else if (o.status === 'rejected') {
    h += '<div class="card center"><span class="pill bad">Payment not verified</span><p>' + esc(o.reject_reason || 'We could not verify your payment.') + '</p>' +
      ((s.contact_phone || s.contact_email) ? '<p class="sub">Questions? ' + esc(s.contact_phone || '') + ' ' + esc(s.contact_email || '') + '</p>' : '') + '</div>';
  } else {
    h += '<div class="center" style="margin:14px 0"><span class="pill ok">Approved</span></div>';
    var ctx = { s: s, typeName: o.type_name, accent: o.accent_color, bgUrl: 'assets/ticket-bg.jpg',
                logoUrl: pubUrl((s.ticket_design || {}).logo_path || s.logo_path) };
    var people = o.people || [];
    if (o.code) h += '<div class="tick">' + renderTicketSVG({ code: o.code, attendee_name: people.join(', '), count: people.length }, ctx) + '</div>';
    h += '<div class="card"><b>This ticket admits ' + people.length + (people.length === 1 ? ' person' : ' people') + '</b><ol style="margin:6px 0 0;padding-left:20px">' +
         people.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ol></div>';
    // plain link (not fetch): a normal page visit needs no CORS and also works on iPhone
    h += '<a class="btn block" id="dlBtn" href="' + esc(API_BASE + '/api/ticket-pdf?token=' + encodeURIComponent(token)) + '" target="_blank" rel="noopener">Download PDF</a>' +
         '<p class="sub center">Show this QR code at the gate. It lets everyone on the ticket in together, once. Bring every person\'s original Aadhaar card.</p>';
  }
  $('app').innerHTML = shell(h);
  if (o.status === 'pending') pollTimer = setInterval(function () { viewOrderQuiet(token); }, 30000);
}
async function viewOrderQuiet(token) {
  var r = await sb.rpc('get_order', { p_token: token });
  if (r.data && r.data.status !== 'pending') viewOrder(token);
}

// ───────────── boot ─────────────
(function () {
  var c = lsGet('tk_settings_cache', null);
  if (c) { S.settings = c; applyTheme(c.theme); document.title = c.name || document.title; }
  else applyTheme({});
  route();
})();
</script>
