     The image is served by the admin site: the one uploaded in Admin > Event, else assets/og-image.jpg. -->

<!-- Noto fonts are always loaded: the on-screen ticket uses them so it matches the PDF (Hindi names too) -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,600..700;1,9..144,500..700&family=Noto+Serif+Devanagari:wght@600&display=swap" rel="stylesheet">
<link id="themeFont" rel="stylesheet" href="">
<style>
  :root{
    --primary:#f5b83d; --bg:#1f0823; --card:#321037; --text:#fdf3e3; --accent:#f5cc6a; --btntext:#2b0a30;
    --radius:14px; --font:'Poppins','Noto Sans Devanagari',sans-serif;
    --muted:color-mix(in srgb, var(--text) 68%, transparent);
    --line:color-mix(in srgb, var(--text) 16%, transparent);
    --field:color-mix(in srgb, var(--text) 8%, var(--card));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh;
       padding-bottom:env(safe-area-inset-bottom)}
  a{color:var(--accent)}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
  .banner{width:100%;aspect-ratio:16/7;object-fit:cover;display:block;background:var(--card)}
  .hero{padding:18px 0 4px;text-align:center}
  .logo{width:72px;height:72px;object-fit:contain;border-radius:calc(var(--radius) - 2px);margin:-44px auto 8px;display:block;background:var(--card);border:2px solid var(--bg)}
  h1{font-size:28px;line-height:1.15;margin:6px 0 8px;color:var(--accent)}
  h2{font-size:18px;margin:26px 0 10px}
  .meta{color:var(--muted);font-size:14px;margin:2px 0}
  .desc{white-space:pre-wrap;margin:14px 0;color:var(--text)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
  .row{display:flex;gap:12px;align-items:center;justify-content:space-between}
  .tname{font-weight:600;font-size:17px}
  .price{font-weight:700;font-size:20px;color:var(--accent);white-space:nowrap}
  .sub{color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line)}
  .pill.ok{background:#1e6b3a33;border-color:#2fb36a;color:#6ee7a0}
  .pill.warn{background:#a8700033;border-color:#e0a030;color:#ffd27a}
  .pill.bad{background:#8a1c1c33;border-color:#e05555;color:#ff9a9a}
  button,.btn{font-family:inherit;font-size:16px;font-weight:600;border:0;border-radius:var(--radius);padding:13px 18px;cursor:pointer;
       background:var(--primary);color:var(--btntext);text-decoration:none;display:inline-block;text-align:center}
  button:disabled{opacity:.55;cursor:default}
  .btn.ghost,button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.block,button.block{display:block;width:100%}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;color:var(--muted)}
  input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);
       border-radius:calc(var(--radius) - 4px);padding:12px;outline:none}
  input:focus,select:focus{border-color:var(--primary)}
  input.bad{border-color:#ff6b6b}
  .err{background:#8a1c1c44;border:1px solid #e05555;color:#ffb3b3;border-radius:calc(var(--radius) - 4px);padding:10px 12px;margin:14px 0;font-size:14px;display:none}
  .err.show{display:block}
  .steps{display:flex;gap:6px;margin:16px 0}
  .steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
  .steps i.on{background:var(--primary)}
  .steplabel{font-size:13px;color:var(--muted);margin-bottom:2px}
  .terms{font-size:13px;color:var(--muted);white-space:pre-wrap;border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
  .total{font-size:34px;font-weight:700;color:var(--accent);text-align:center;margin:6px 0}
  .qr{display:block;margin:10px auto;width:min(280px,80%);aspect-ratio:1;object-fit:contain;background:#fff;border-radius:12px;padding:8px}
  .instr{white-space:pre-wrap;font-size:14px;color:var(--text)}
  .tick{margin:14px 0;border-radius:calc(var(--radius) - 2px);overflow:hidden;border:1px solid var(--line)}
  .thumb{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:10px auto}
  .center{text-align:center}
  .loading{padding:70px 0;text-align:center;color:var(--muted)}
  .back{background:none;border:0;color:var(--muted);padding:14px 0 0;font-size:14px;cursor:pointer;font-family:inherit}
  .footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .nameRow{display:flex;gap:8px;align-items:center}
  .nameRow span{min-width:22px;color:var(--muted);font-size:13px}
  .person{border:1px solid var(--line);border-radius:calc(var(--radius) - 4px);padding:10px;margin-bottom:10px}
        color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
  .hidden{display:none}
  .notice{border-left:4px solid var(--accent)}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:500;color:var(--text);margin:14px 0}
  .chk input{width:22px;height:22px;flex:0 0 auto;margin-top:1px}
  /* ═════════ Landing page (event page only) — flat colour-blocked Indian palette ═════════
     Fixed brand palette (the art direction); the main button follows the admin theme's primary colour. */
  :root{
    --au:#2a0430; --au2:#3b0a44; --poster:#38003a; --mari:#f4b63f; --red:#7d0f5c; --teal:#57106a; --cream:#fbeed6; --gold:#ffd56a;
    --pink:#e0297a; --plum:#8a2b8c; --ink:#2a0430;
    --f-display:'Fraunces','Noto Serif Devanagari',Georgia,serif;
  }
  .lp{background:var(--au);color:var(--cream)}
  .lp-band{position:relative;padding:28px 16px 44px}
  .lp-band > .lp-in{max-width:680px;margin:0 auto;position:relative}
  .lp-edge{display:block;width:100%;height:30px;background-repeat:repeat-x;background-size:56px 30px;background-position:center top}
  .lp-edge.flip{transform:scaleY(-1)}
  .lp-diamonds{display:flex;justify-content:space-around;max-width:680px;margin:0 auto;padding:6px 8px 0}
  .lp-diamonds i{width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}

  /* hero: the event poster is the hero */
  .lp-band.lp-hero{position:relative;background:var(--poster);text-align:center;padding:0 0 40px;overflow:hidden;isolation:isolate}
  .lp-hero-bg{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 0%,transparent 55%,var(--poster) 88%),
    radial-gradient(ellipse 60% 55% at 50% 38%,#6c0d66 0%,#4a0450 45%,var(--poster) 75%,var(--poster) 100%)}
  @media (max-width:599px){ .lp-hero-bg{background:var(--poster)} }
  .lp-poster{display:block;width:100%;max-width:620px;height:auto;margin:0 auto;
    -webkit-mask-image:linear-gradient(180deg,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,#000 80%,transparent 100%)}
  .lp-hero .lp-in{position:relative;z-index:2;margin-top:-6%;padding:0 16px}
  @media (min-width:600px){
    .lp-hero .lp-in{margin-top:4px}
    .lp-poster{-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent 100%),linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
      -webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,#000 80%,transparent 100%),linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-composite:intersect}
  }
  .lp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .lp-meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 12px;font-size:15px;color:#f6dfee;margin-bottom:22px}
  .lp-meta .sep{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);flex:0 0 auto}
  .lp-meta span{display:inline-flex;align-items:center;gap:6px}
  @media (max-width:560px){ .lp-meta{flex-direction:column;gap:8px} .lp-meta .sep{display:none} }
  .lp-meta svg{width:16px;height:16px;color:var(--gold)}
  .lp-cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 30px;border-radius:8px;border:0;cursor:pointer;
    font:inherit;font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--btntext);text-decoration:none;background:var(--primary);
    box-shadow:0 0 0 2px var(--poster),0 0 0 3px color-mix(in srgb,var(--primary) 70%,transparent),0 10px 30px rgba(244,182,63,.25);transition:filter .15s ease,transform .15s ease}
  .lp-cta:hover{filter:brightness(1.07)}
  .lp-cta:active{transform:translateY(1px)}
  .lp-cta svg{width:18px;height:18px}
  .lp-cta:focus-visible,.lp-btn:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
  .lp-from{margin-top:12px;font-size:14px;color:#ecd2e4}
  .lp-from b{color:var(--cream)}
  .lp-closed{display:inline-block;padding:12px 18px;border:1px solid rgba(251,238,214,.35);border-radius:8px;color:var(--cream)}

  /* section headings */
  .lp-h{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,8vw,38px);line-height:1.1;margin:6px 0 18px;text-align:center;font-variation-settings:"SOFT" 100}
  .lp-orn{display:flex;justify-content:center;align-items:center;gap:9px;margin:0 auto 12px}
  .lp-orn i{width:7px;height:7px;background:currentColor;transform:rotate(45deg);opacity:.7}
  .lp-orn i:nth-child(2){width:10px;height:10px;opacity:1}

  /* about: marigold band + jharokha arch card */
  .lp-about{background:var(--mari);color:var(--ink)}
  .lp-arch{position:relative;margin:4px auto 0;max-width:560px;filter:drop-shadow(0 10px 18px rgba(43,16,37,.18))}
  .lp-arch svg{display:block;width:100%;height:clamp(54px,16vw,84px)}
  .lp-arch-body{background:var(--cream);margin-top:-1px;padding:6px 26px 28px;border-radius:0 0 6px 6px;position:relative}
  .lp-arch-body::before{content:"";position:absolute;inset:0 10px 10px;border:1.5px solid rgba(156,29,37,.35);border-top:0;border-radius:0 0 4px 4px;pointer-events:none}
  .lp-about p{font-family:var(--f-display);font-style:italic;font-size:19px;line-height:1.6;text-align:center;margin:0;white-space:pre-wrap;color:var(--ink)}

  /* passes: deep red band + cream ticket stubs */
  .lp-passes{background:var(--red)}
  .lp-pass{position:relative;margin:0 0 18px;padding:22px 22px 20px;color:var(--ink);border-radius:10px;
    background:var(--cream);
    border-top:6px solid var(--pass-accent,var(--au))}
  .lp-perf{position:relative;height:0;margin:18px -22px 0;border-top:2px dashed rgba(43,16,37,.22)}
  .lp-perf::before,.lp-perf::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--red)}
  .lp-perf::before{left:-13px}
  .lp-perf::after{right:-13px}
  .lp-pass-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
  .lp-pass-name{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.15;margin:0;font-variation-settings:"SOFT" 100}
  .lp-pass-desc{font-size:14px;color:rgba(43,16,37,.72);margin-top:4px}
  .lp-price{text-align:right;flex:0 0 auto}
  .lp-price b{display:block;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;color:var(--red)}
  .lp-price small{font-size:12px;color:rgba(43,16,37,.65)}
  .lp-star{position:absolute;left:50%;top:-21px;width:34px;height:34px;transform:translateX(-50%)}
  .lp-seats{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:rgba(43,16,37,.75);margin:14px 0 12px}
  .lp-seats.low b{color:var(--red)}
  .lp-perf + .lp-btn{margin-top:18px}
  .lp-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:8px;cursor:pointer;
    font:inherit;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--cream);background:var(--au);text-decoration:none;transition:background .15s ease}
  .lp-btn:hover{background:var(--au2)}
  .lp-btn svg{width:18px;height:18px}
  .lp-btn.light{background:transparent;color:var(--cream);border:1.5px solid rgba(248,234,208,.7);text-transform:none;letter-spacing:0}
  .lp-btn.light:hover{background:rgba(248,234,208,.1)}
  .lp-sold{display:inline-block;background:var(--red);color:var(--cream);font-weight:700;font-size:11px;letter-spacing:.16em;padding:4px 9px;border-radius:4px;margin-bottom:8px}
  .lp-pass.sold{background:#ebe2d2;border-top-color:#8f8379}
  .lp-pass.sold > :not(.lp-perf){opacity:.62;filter:saturate(.4)}
  .lp-pass.sold .lp-price b{text-decoration:line-through;text-decoration-thickness:2px}
  .lp-note{text-align:center;font-size:14px;color:rgba(248,234,208,.85);margin:6px 0 0}

  /* dark band: pass preview, rules, bookings */
  .lp-dark{background:var(--au)}
  .lp-rules{list-style:none;margin:0 auto;padding:0;max-width:560px}
  .lp-rules li{display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.55;padding:12px 2px;border-bottom:1px solid rgba(248,234,208,.14)}
  .lp-rules li:last-child{border-bottom:0}
  .lp-rules li::before{content:"";width:9px;height:9px;margin-top:8px;flex:0 0 auto;background:var(--gold);transform:rotate(45deg)}
  .lp-sub{margin-top:40px}

  /* teal band: contact + tiles */
  .lp-help{background:var(--teal);color:var(--cream)}
  .lp-contact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lp-tiles{display:flex;justify-content:center;overflow:hidden;height:56px;background:var(--au)}
  .lp-tiles svg{flex:0 0 56px;width:56px;height:56px}
  .lp-foot{background:var(--au);text-align:center;color:rgba(248,234,208,.7);font-size:13px;padding:16px 16px 120px}

  .lp-sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(43,16,37,.96);border-top:1px solid rgba(248,234,208,.15);transform:translateY(110%);transition:transform .25s ease}
  .lp-sticky.show{transform:none}
  .lp-sticky .lp-cta{width:100%;max-width:640px;display:flex;margin:0 auto;box-shadow:none}
  .lp-reveal{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
  .lp-reveal.in{opacity:1;transform:none}
  @media (min-width:700px){ .lp-band{padding:40px 24px 60px} .lp-band.lp-hero{padding:0 0 56px} }
  /* ═════════ Booking flow (buy steps + order page): same art direction as the landing page ═════════ */
  .bk{background:var(--au);color:var(--cream);min-height:100vh}
  .bk-head{position:relative;overflow:hidden;isolation:isolate;text-align:center;padding:14px 64px 16px;background:linear-gradient(180deg,#5c0a5a 0%,var(--poster) 100%)}
  .bk-head .lp-fx{z-index:0;-webkit-mask-image:linear-gradient(90deg,#000 0 18%,transparent 30% 70%,#000 82%);mask-image:linear-gradient(90deg,#000 0 18%,transparent 30% 70%,#000 82%)}
  .bk-home{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--cream);background:rgba(255,255,255,.08);border:1px solid rgba(251,238,214,.28)}
  .bk-home svg{width:20px;height:20px}
  .bk-home:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .bk-brand{position:relative;z-index:1}
  .bk-name{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.1;color:var(--cream)}
  .bk-name em{font-style:italic;font-weight:600;color:var(--mari)}
  .bk-date{font-size:13px;color:#ecd2e4;margin-top:3px;letter-spacing:.03em}
  .bk-main{max-width:600px;margin:0 auto;padding:6px 16px 48px}
  .bk-main > *{animation:bkIn .4s ease both}
  @keyframes bkIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .bk .back{display:inline-flex;align-items:center;min-height:44px;padding:0;color:#ecd2e4;font-size:14px}
  .bk-steps{display:flex;list-style:none;margin:8px 0 16px;padding:0}
  .bk-steps li{flex:1;position:relative;text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(251,238,214,.5)}
  .bk-steps li i{display:block;width:14px;height:14px;margin:0 auto 8px;transform:rotate(45deg);border:2px solid rgba(251,238,214,.4);background:var(--au);position:relative;z-index:1}
  .bk-steps li::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:rgba(251,238,214,.18)}
  .bk-steps li:first-child::before{display:none}
  .bk-steps li.done{color:#f0d9b0}
  .bk-steps li.done i{background:var(--mari);border-color:var(--mari)}
  .bk-steps li.on{color:var(--cream);font-weight:700}
  .bk-steps li.on i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px rgba(255,213,106,.18)}
  .bk-steps li.done::before,.bk-steps li.on::before{background:var(--mari)}
  .bk .card{background:var(--cream);color:var(--ink);border:0;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.28)}
  .bk .tname{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink)}
  .bk .card .sub,.bk-sheet .sub{color:rgba(42,4,48,.66)}
  .bk-main > .sub,.bk-main > p.sub{color:rgba(251,238,214,.78)}
  .bk .price{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--red)}
  .bk-sheet{color-scheme:light;position:relative;background:var(--cream);color:var(--ink);border-radius:16px;border-top:5px solid var(--mari);padding:16px 16px 20px;margin-top:14px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
  .bk-sheet .card{background:#f6e4c4;box-shadow:none;border:1px solid rgba(42,4,48,.08)}
  .bk-sheet label{color:rgba(42,4,48,.78)}
  .bk input,.bk select{background:#fffdf7;color:var(--ink);border:1.5px solid rgba(42,4,48,.2);border-radius:10px;min-height:48px}
  .bk input:focus,.bk select:focus{border-color:var(--mari);box-shadow:0 0 0 3px rgba(244,182,63,.35)}
  .bk input.bad{border-color:#d23a64;box-shadow:0 0 0 3px rgba(210,58,100,.18)}
  .bk input[type=file]{min-height:0;background:#fff}
  .bk input[type=checkbox]{min-height:0;width:22px;height:22px;padding:0;border-radius:4px;accent-color:var(--red);background:#fff}
  .bk .chk{align-items:center;min-height:44px;cursor:pointer}
  .bk .person{background:#fffaf0;border:1.5px dashed rgba(42,4,48,.2)}
  .bk .nameRow span{color:rgba(42,4,48,.6);font-weight:700}
  .bk .card.notice{background:#fff3d6;border-left:4px solid var(--mari)}
  .bk .instr{color:var(--ink)}
  .bk .chk{color:var(--ink)}
  .bk .chk.bad{color:#9b1c3a}
  .bk .err{background:#fdecef;border:1px solid #e07a96;color:#8c1236}
  .bk .terms{color:rgba(42,4,48,.6);border-top-color:rgba(42,4,48,.12)}
  .bk button.block,.bk .btn.block,.bk-cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;margin-top:16px;border-radius:10px;
    background:var(--primary);color:var(--btntext);font-weight:700;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 10px 24px rgba(244,182,63,.28);text-decoration:none}
  .bk button.block::after,.bk .btn.block::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;

  var r = await sb.rpc('staff_remaining', { p_key: B.staff, p_email: B.email.trim(), p_phone: B.phone.trim() });
  if (btn) { btn.disabled = false; btn.textContent = 'Continue to payment'; }
  if (!r.error) {   // (if the check itself is unavailable, the server still enforces the limit at submit)
    if (r.data == null) return showErr(friendly(new Error('BAD_STAFF_LINK')));
    if (r.data < peopleCount()) return showErr(friendly(new Error('STAFF_LIMIT:' + r.data)), r.data > 0 ? 'f_qty' : null);
  }
  B.step = 2; drawBuy(); window.scrollTo(0, 0);
}
function toStep3() {
  readStep();
  if (B.payer.trim().length < 2) return showErr('Enter the name shown in your payment app.', 'f_payer');
  B.step = 3; drawBuy(); window.scrollTo(0, 0);
}

// Resize the payment screenshot to ~900px JPEG before upload
function compress(file, maxDim) {
  maxDim = maxDim || 900;
  return new Promise(function (resolve, reject) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var sc = Math.min(1, maxDim / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? resolve(b) : reject(new Error('Could not process the image')); }, 'image/jpeg', 0.8);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That file is not a readable image')); };
    img.src = url;
  });
}
async function onShot(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  try {
    B.shot = await compress(f);
    if (B.shotUrl) URL.revokeObjectURL(B.shotUrl);
    B.shotUrl = URL.createObjectURL(B.shot);
    $('shotPrev').innerHTML = '<img class="thumb" src="' + B.shotUrl + '" alt="screenshot preview">';
    if ($('err')) $('err').className = 'err';
  } catch (e) { B.shot = null; showErr(e.message); }
}
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
var ERR_MAP = {
  SALES_CLOSED: 'Ticket sales are closed.', SOLD_OUT: 'Sorry, these tickets just sold out.',
  TYPE_UNAVAILABLE: 'This ticket type is no longer available.', TOO_MANY_PENDING: 'You already have several orders waiting for verification with this email. Please wait for them to be approved.',
  BAD_NAME: 'Please check your name.', BAD_PHONE: 'Please check your phone number.', BAD_EMAIL: 'Please check your email address.',
  BAD_PAYER: 'Please check the name shown in your payment app.', BAD_ATTENDEES: 'Please check the names on the tickets.',
  BAD_SCREENSHOT: 'The screenshot upload did not work. Please choose the image again.',
  DANDIYA_OFF: 'Dandiya rental is not available right now.', ORDER_NOT_APPROVED: 'Your ticket must be approved before renting dandiya.',
  DANDIYA_EXISTS: 'You already have a dandiya request for this ticket.', NOT_FOUND: 'We could not find this order.', BAD_QTY: 'Please check the number of tickets.'
};
function friendly(e) {
  var m = String(e && e.message || e), code = m.split(':')[0], arg = m.split(':')[1];
  if (code === 'NOT_ENOUGH_SEATS') return 'Not enough passes left for this many. Please choose a smaller number.';
  if (code === 'STAFF_LIMIT') return +arg > 0 ? 'Staff can book for up to ' + (STAFF ? STAFF.max_people : 2) + ' people in total, and you have ' + arg + ' left. Please choose fewer.'
    : 'You have already used your staff booking (up to ' + (STAFF ? STAFF.max_people : 2) + ' people per staff member). Your earlier booking is in your email.';
  if (code === 'BAD_STAFF_LINK') return 'This staff link is not active any more. Please open it again from the staff portal.';
  if (code === 'MAX_PER_ORDER') return 'You can buy at most ' + arg + ' tickets per order.';
  if (code === 'BAD_PAIRS') return 'Choose between 1 and ' + arg + ' pairs.';
  return ERR_MAP[code] || 'Could not place your order: ' + m;
}

async function submitOrder() {
  if (B.busy) return;
  if (!B.shot) return showErr('Please upload your payment screenshot.', 'f_shot');
  var btn = $('submitBtn'), t = curType();
  B.busy = true; btn.disabled = true; btn.textContent = 'Checking availability…';
  try {
    // re-check availability and sale window right before submitting
    await Promise.all([loadTypes(), loadSettings()]);
    if (salesState(S.settings) !== 'open') throw new Error('SALES_CLOSED');
    var fresh = S.types.filter(function (x) { return x.id === t.id; })[0];
    if (!fresh || fresh.remaining <= 0) throw new Error('SOLD_OUT');
    if (fresh.remaining < B.qty) throw new Error('NOT_ENOUGH_SEATS:' + fresh.remaining);

    btn.textContent = 'Uploading screenshot…';
    var path = uuid() + '.jpg';
    var up = await sb.storage.from('screenshots').upload(path, B.shot, { contentType: 'image/jpeg', upsert: false });
    if (up.error) throw new Error('BAD_SCREENSHOT');

    btn.textContent = 'Placing order…';
    var args = {
      p_type_id: t.id, p_qty: B.qty, p_buyer_name: B.name.trim(), p_email: B.email.trim(), p_phone: B.phone.trim(),
      p_payer_name: B.payer.trim(), p_screenshot_path: path, p_names: B.names.slice(0, peopleCount()).map(function (n) { return n.trim(); }),
      p_id_paths: []
    };
    if (B.staff) args.p_staff_key = B.staff;   // staff price + per-staff limit are applied by the server
    if (rolesOn(t)) args.p_roles = B.names.slice(0, peopleCount()).map(function (n, i) { return B.roles[i] === 'student' && !B.staff ? 'student' : B.roles[i] === 'child' && B.staff ? 'child' : 'guest'; });
    var r = await sb.rpc('create_order', args);
    if (r.error) throw r.error;
    var token = r.data;
    var mine = lsGet(MY_KEY, []); mine.unshift({ token: token, at: Date.now() }); lsSet(MY_KEY, mine.slice(0, 20));
    if (API_BASE.indexOf('YOUR-') < 0) {       // "order received" email; failure must never block the buyer
      try { fetch(API_BASE + '/api/order-received', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }), keepalive: true }); } catch (e) {}
    }
    B = null;
    go('#/order/' + token);
  } catch (e) {
    B.busy = false; btn.disabled = false; btn.textContent = 'Submit order';
    showErr(friendly(e));
    var em = String(e.message), home = B.staff ? '#/staff/' + encodeURIComponent(B.staff) : '#/';
    if (/^STAFF_LIMIT:[1-9]/.test(em)) { btn.textContent = 'Change number of people'; btn.onclick = function () { buyStep(1); }; }
    else if (/SOLD_OUT|NOT_ENOUGH|SALES_CLOSED|TYPE_UNAVAIL|STAFF_LIMIT|BAD_STAFF_LINK/.test(em)) { btn.textContent = 'Go back'; btn.onclick = function () { go(home); }; }
  }
}

// ───────────── private order page ─────────────
async function viewOrder(token) {
  try { await loadSettings(); } catch (e) { return fail(e); }
  var r = await sb.rpc('get_order', { p_token: token });
  if (r.error) return fail(r.error);
  var o = r.data;
  if (!o) { $('app').innerHTML = shell('<div class="card center">We could not find this order.<br><br><a class="btn ghost" href="#/">Back to event</a></div>'); return; }
  var mine = lsGet(MY_KEY, []);
  if (!mine.some(function (m) { return m.token === token; })) { mine.unshift({ token: token, at: Date.now() }); lsSet(MY_KEY, mine.slice(0, 20)); }

  var s = S.settings, h = '<div class="bk-order"><small>Your booking</small><h1>' + esc(o.order_no) + '</h1></div>';
  h += '<div class="card"><div class="row"><div><div class="tname">' + esc(o.qty) + ' × ' + esc(o.type_name) + '</div><div class="sub">' + esc(o.buyer_name) + ' · ' + esc(o.email) + '</div></div><div class="price">' + rupees(o.amount) + '</div></div></div>';
  if (o.status === 'pending') {
    if ((o.slots || []).indexOf('Student') >= 0 && !o.consent_ok)
      h += '<div class="card notice bk-consent"><b>Waiting for the consent form</b><div class="sub" style="color:inherit">This pass has a student. It is issued only after her signed consent form is received at school. Please submit it at school; your pass is then emailed to you.</div></div>';
    h += '<div class="card bk-status"><div class="bk-ico wait">' + ICON.clock + '</div><h2>Verifying your payment</h2>' +
      '<p>This may take <b>up to 24 hours</b>. Your pass will be emailed to <b>' + esc(o.email) + '</b> once it is approved.</p>' +
      '<p class="sub">You can come back to this same page any time to check \u2014 it updates by itself. Keep this link; it is private to you.</p></div>';
  } else if (o.status === 'rejected') {
    h += '<div class="card bk-status"><div class="bk-ico no">' + ICON.x + '</div><h2>Payment not verified</h2><p>' + esc(o.reject_reason || 'We could not verify your payment.') + '</p>' +
      ((s.contact_phone || s.contact_email) ? '<p class="sub">Questions? ' + esc(s.contact_phone || '') + ' ' + esc(s.contact_email || '') + '</p>' : '') + '</div>';
  } else {
    h += '<div class="bk-yay"><h2>You\'re in!</h2><p>Your pass is ready. See you on the dance floor.</p></div>';
    var ctx = { s: s, typeName: o.type_name, accent: o.accent_color, bgUrl: 'assets/ticket-bg.jpg',
                logoUrl: pubUrl((s.ticket_design || {}).logo_path || s.logo_path) };
    var people = o.people || [];
    if (o.code) h += '<div class="tick">' + renderTicketSVG({ code: o.code, attendee_name: people.join(', '), count: people.length }, ctx) + '</div>';
    var slots = o.slots || [];
    var admits = '<div class="card bk-people"><h3>Admits ' + people.length + (people.length === 1 ? ' person' : ' people') + '</h3><ol>' +
         people.map(function (n, i) { return '<li>' + esc(n) + (slots[i] ? ' <small>' + esc(slots[i]) + '</small>' : '') + '</li>'; }).join('') + '</ol></div>';
    // plain link (not fetch): a normal page visit needs no CORS and also works on iPhone
    h += '<a class="btn block" id="dlBtn" href="' + esc(API_BASE + '/api/ticket-pdf?token=' + encodeURIComponent(token)) + '" target="_blank" rel="noopener">Download PDF</a>' + dandiyaCard(o, token) + admits + (slots.indexOf('Student') >= 0 ? '<div class="card notice bk-consent"><b>Students: consent form</b><div class="sub" style="color:inherit">Each student on this pass must submit the signed consent form at school before the event. It is checked at the gate.</div></div>' : '') + venueCard(s) +
         '<p class="sub center">Show this QR code at the gate. It lets everyone on the ticket in together, once.</p>';
  }
  $('app').innerHTML = shell(h, { celebrate: o.status === 'approved' });
  var sig = orderSig(o);
  if (o.status === 'pending' || (o.dandiya && o.dandiya.status === 'pending')) pollTimer = setInterval(function () { viewOrderQuiet(token, sig); }, 30000);
}
function orderSig(o) { return o.status + '|' + (o.dandiya ? o.dandiya.status : ''); }
async function viewOrderQuiet(token, sig) {
  var r = await sb.rpc('get_order', { p_token: token });
  if (r.data && orderSig(r.data) !== sig) viewOrder(token);
}

// Venue map from settings.venue_map (a Google Maps link or a typed address). Returns null when not set.
// q = what the embedded map pins; link = where "Open in Google Maps" goes. Short links (maps.app.goo.gl) can't be
// read in the browser, so their pin falls back to the venue name; full links pin the exact place.
function venueMap(s) {
  var raw = String((s && s.venue_map) || '').trim(), q = '', link = '', m;
  if (!raw) return null;
  if (/^https?:\/\//i.test(raw)) {
    link = raw;
    m = raw.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || raw.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
        raw.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i);
    if (m) q = m[1] + ',' + m[2];
    else if ((m = raw.match(/[?&](?:q|query|destination)=([^&#]+)/i) || raw.match(/\/place\/([^/@?#]+)/))) {
      try { q = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { q = ''; }
    }
    if (!q) q = (s.venue || '').trim();
  } else {
    q = raw; link = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(raw);
  }
  return { q: q, link: link, embed: q ? 'https://maps.google.com/maps?q=' + encodeURIComponent(q) + '&z=16&output=embed' : '' };
}
function venueCard(s) {
  var m = venueMap(s); if (!m) return '';
  return '<div class="card bk-map"><h3>' + ICON.pin + 'Venue</h3>' +
    (s.venue ? '<p class="bk-map-name">' + esc(s.venue) + '</p>' : '') +
    (s.date_text ? '<p class="bk-map-when">' + ICON.cal + esc(s.date_text) + '</p>' : '') +
    (m.embed ? '<div class="bk-map-frame"><iframe src="' + esc(m.embed) + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map to ' + esc(s.venue || 'the venue') + '" allowfullscreen></iframe></div>' : '') +
    '<a class="btn block" href="' + esc(m.link) + '" target="_blank" rel="noopener">' + ICON.pin + 'Get directions</a></div>';
}

// ───────────── dandiya rental (after the ticket is approved) ─────────────
function dandiyaPer() { var s = S.settings || {}; return (s.dandiya_rent || 0) + (s.dandiya_deposit || 0); }
function dandiyaCard(o, token) {
  var s = S.settings || {}, d = o.dandiya, rent = s.dandiya_rent || 0, dep = s.dandiya_deposit || 0, per = rent + dep;
  if (d && d.status === 'pending') {
    return '<div class="card bk-dandiya"><h3>' + ICON.sticks + 'Dandiya rental</h3><span class="bk-badge wait">' + ICON.clock + 'Verification pending</span>' +
      '<p><b>' + d.pairs + ' pair' + (d.pairs === 1 ? '' : 's') + '</b> \u00B7 ' + rupees(d.amount) + '</p>' +
      '<p class="sub">We are verifying your dandiya payment. This may take up to 24 hours \u2014 you can check back on this page any time.</p></div>';
  }
  if (d && d.status === 'approved') {
    return '<div class="card bk-dandiya"><h3>' + ICON.sticks + 'Dandiya rental</h3><span class="bk-badge ok">' + ICON.check + 'Verification complete</span>' +
      '<p><b>' + d.pairs + ' pair' + (d.pairs === 1 ? '' : 's') + '</b> reserved for you. Collect them at the venue.</p>' +
      (d.deposit_refunded ? '<p><span class="bk-badge ok">' + ICON.check + 'Security refunded</span></p>'
                          : '<p class="sub">Return them after the event to get your ' + rupees(dep * d.pairs) + ' security deposit back.</p>') + '</div>';
  }
  if (!s.dandiya_enabled) return '';
  var max = s.dandiya_max || 10, opts = '';
  for (var i = 1; i <= max; i++) opts += '<option value="' + i + '">' + i + ' pair' + (i === 1 ? '' : 's') + '</option>';
  return '<div class="card bk-dandiya"><h3>' + ICON.sticks + 'Rent dandiya sticks?</h3>' +
    (d && d.status === 'rejected' ? '<p><span class="bk-badge no">' + ICON.x + 'Previous request not verified</span></p>' + (d.reject_reason ? '<p class="sub">' + esc(d.reject_reason) + '</p>' : '') : '') +
    '<p>No sticks? Rent a pair for <b>' + rupees(per) + '</b>: ' + rupees(rent) + ' rent + ' + rupees(dep) + ' security deposit. ' +
    'The ' + rupees(dep) + ' deposit per pair is refunded when you return the sticks after the event.</p>' +
    '<div class="row"><div><label for="dk_pairs" style="color:rgba(42,4,48,.78)">How many pairs?</label><select id="dk_pairs" onchange="$(\'dk_sum\').textContent=rupees(dandiyaPer()*this.value)">' + opts + '</select></div>' +
    '<div class="bk-sum" id="dk_sum">' + rupees(per) + '</div></div>' +
    '<button class="block" onclick="startDandiya(\'' + esc(token) + '\')">Rent dandiya</button></div>';
}
function startDandiya(token) {
  var n = Number(($('dk_pairs') || {}).value) || 1;
  DR = { token: token, step: 2, pairs: n, payer: '', shot: null, shotUrl: '', busy: false };
  go('#/order/' + token + '/dandiya');
}
async function viewDandiya(token) {
  try { await loadSettings(); } catch (e) { return fail(e); }
  var r = await sb.rpc('get_order', { p_token: token });
  var o = r.data, d = o && o.dandiya;
  if (!o || o.status !== 'approved' || !S.settings.dandiya_enabled || (d && d.status !== 'rejected')) { go('#/order/' + token); return; }
  if (!DR || DR.token !== token) DR = { token: token, step: 1, pairs: 1, payer: '', shot: null, shotUrl: '', busy: false };
  drawDandiya();
}
function drawDandiya() {
  var s = S.settings, labels = ['Pairs', 'Pay', 'Screenshot'], per = dandiyaPer(), total = per * DR.pairs, h = '';
  h += '<button class="back" onclick="' + (DR.step > 1 ? 'dandiyaStep(' + (DR.step - 1) + ')' : "go('#/order/" + esc(DR.token) + "')") + '">\u2190 ' + (DR.step > 1 ? 'Back to ' + labels[DR.step - 2].toLowerCase() : 'Back to your ticket') + '</button>';
  h += '<ol class="bk-steps" aria-label="Step ' + DR.step + ' of 3">' + labels.map(function (l, n) {
    return '<li class="' + (n + 1 < DR.step ? 'done' : n + 1 === DR.step ? 'on' : '') + '"' + (n + 1 === DR.step ? ' aria-current="step"' : '') + '><i></i>' + l + '</li>';
  }).join('') + '</ol>';
  h += '<div class="card row"><div><div class="tname">Dandiya sticks</div><div class="sub">' + rupees(per) + ' per pair (' + rupees(s.dandiya_rent) + ' rent + ' + rupees(s.dandiya_deposit) + ' refundable)</div></div><div class="price">' + rupees(total) + '</div></div>';
  h += '<section class="bk-sheet">';
  if (DR.step === 1) {
    var opts = '';
    for (var i = 1; i <= (s.dandiya_max || 10); i++) opts += '<option value="' + i + '"' + (i === DR.pairs ? ' selected' : '') + '>' + i + ' pair' + (i === 1 ? '' : 's') + '</option>';
    h += '<label for="d_pairs">How many pairs do you need?</label><select id="d_pairs" onchange="DR.pairs=Number(this.value);document.querySelector(\'.bk .price\').textContent=rupees(dandiyaPer()*DR.pairs)">' + opts + '</select>' +
      '<div class="card notice" style="margin-top:14px"><div class="instr">Each pair costs ' + rupees(per) + ': ' + rupees(s.dandiya_rent) + ' rent + ' + rupees(s.dandiya_deposit) + ' security deposit. ' +
      'Collect the sticks at the venue; the ' + rupees(s.dandiya_deposit) + ' deposit per pair is refunded when you return them after the event.</div></div>' +
      '<div id="err" class="err"></div><button class="block" onclick="dandiyaStep(2)">Continue to payment</button>';
  } else if (DR.step === 2) {
    var qr = (s.dandiya_qrs || {})[String(DR.pairs)] || s.payment_qr_path;
    h += '<div class="card"><div class="center sub">Pay exactly</div><div class="total">' + rupees(total) + '</div><div class="center sub">' + DR.pairs + ' pair' + (DR.pairs === 1 ? '' : 's') + ' \u00D7 ' + rupees(per) + '</div>' +
      (qr ? '<img class="qr" src="' + esc(pubUrl(qr)) + '" alt="UPI QR code for ' + rupees(total) + '">' : '') + upiHTML() + '</div>' +
      '<label for="d_payer">Name by which you have made the payment</label><input id="d_payer" autocomplete="off" value="' + esc(DR.payer) + '" placeholder="As shown in your UPI / bank app">' +
      '<div id="err" class="err"></div><button class="block" onclick="dandiyaStep(3)">I have paid \u2014 continue</button>';
  } else {
    h += '<div class="card"><b>Upload your payment screenshot</b><div class="sub">Used only as a reference so we can verify your payment.</div>' +
      '<input id="d_shot" type="file" accept="image/*" style="margin-top:12px" onchange="onShotD(this)">' +
      '<div id="dShotPrev">' + (DR.shotUrl ? '<img class="thumb" src="' + DR.shotUrl + '" alt="screenshot preview">' : '') + '</div></div>' +
      '<div class="card sub">' + DR.pairs + ' pair' + (DR.pairs === 1 ? '' : 's') + ' = <b>' + rupees(total) + '</b><br>Paid by: <b>' + esc(DR.payer) + '</b></div>' +
      '<div id="err" class="err"></div><button id="dSubmit" class="block" onclick="submitDandiya()">Submit dandiya request</button>';
  }
  h += '</section>';
  $('app').innerHTML = shell(h);
}
function dandiyaStep(n) {
  if (DR.step === 2 && $('d_payer')) DR.payer = $('d_payer').value;
  if (n === 3 && DR.step === 2 && DR.payer.trim().length < 2) return showErr('Enter the name by which you have made the payment.', 'd_payer');
  DR.step = n; drawDandiya(); window.scrollTo(0, 0);
}
async function onShotD(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  try {
    DR.shot = await compress(f);
    if (DR.shotUrl) URL.revokeObjectURL(DR.shotUrl);
    DR.shotUrl = URL.createObjectURL(DR.shot);
    $('dShotPrev').innerHTML = '<img class="thumb" src="' + DR.shotUrl + '" alt="screenshot preview">';
    if ($('err')) $('err').className = 'err';
  } catch (e) { DR.shot = null; showErr(e.message); }
}
async function submitDandiya() {
  if (DR.busy) return;
  if (!DR.shot) return showErr('Please upload your payment screenshot.', 'd_shot');
  var btn = $('dSubmit'); DR.busy = true; btn.disabled = true; btn.textContent = 'Uploading screenshot\u2026';
  try {
    var path = uuid() + '.jpg';
    var up = await sb.storage.from('screenshots').upload(path, DR.shot, { contentType: 'image/jpeg', upsert: false });
    if (up.error) throw new Error('BAD_SCREENSHOT');
    btn.textContent = 'Sending request\u2026';
    var r = await sb.rpc('request_dandiya', { p_token: DR.token, p_pairs: DR.pairs, p_payer_name: DR.payer.trim(), p_screenshot_path: path });
    if (r.error) throw r.error;
    var tk = DR.token; DR = null;
    go('#/order/' + tk);
  } catch (e) {
    DR.busy = false; btn.disabled = false; btn.textContent = 'Submit dandiya request';
    showErr(friendly(e));
  }
}

// ───────────── boot ─────────────
(function () {
  var c = lsGet('tk_settings_cache', null);
  if (c) { S.settings = c; applyTheme(c.theme); document.title = c.name || document.title; }
  else applyTheme({});
  route();
})();
